<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comedy Agent — 喜剧创作助手</title>
    <link rel="stylesheet" href="/static/common.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .sidebar label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #666;
        }
        .sidebar input, .sidebar select, .sidebar button {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .sidebar button {
            background: #1a1a2e;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .sidebar button:hover { opacity: 0.9; }
        .sidebar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }
        .chat-area {
            flex: 1;
            background: #fff;
            border-radius: 0.75rem;
            border: 1px solid #e0e0e0;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #1a1a2e;
            color: #fff;
        }
        .message.agent {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
        }
        .message .meta {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }
        .message .meta .model-tag {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.05rem 0.4rem;
            background: rgba(0,0,0,0.08);
            border-radius: 0.25rem;
            font-size: 0.65rem;
            opacity: 0.8;
        }
        .message.agent .meta .model-tag {
            background: rgba(0,0,0,0.08);
            color: #333;
        }
        .message.user .meta .model-tag {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .suggestion-bar {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f8f9fa;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .suggestion-label { color: #666; margin-right: 0.25rem; }
        .suggestion-hint { color: #888; font-size: 0.75rem; }
        .style-tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            background: #e3e8ee;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            color: #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        .style-tag:hover { background: #d0d8e2; }
        .input-area {
            display: flex;
            gap: 0.5rem;
        }
        .input-area textarea {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            resize: none;
            height: 3.5rem;
            font-family: inherit;
        }
        .input-area button {
            padding: 0 1.5rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-state {
            text-align: center;
            color: #999;
            margin: auto;
        }
        .empty-state h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .typing {
            font-size: 0.75rem;
            color: #999;
            padding: 0 0.5rem;
        }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }
        .conversation-item {
            padding: 0.5rem 0.625rem;
            border-radius: 0.5rem;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }
        .conversation-item:hover { background: #eee; }
        .conversation-item.active { background: #1a1a2e; color: #fff; }
        .conversation-item .conv-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .conversation-item .conv-del {
            font-size: 0.75rem;
            color: #e94560;
            padding: 0 0.25rem;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .conversation-item:hover .conv-del { opacity: 1; }
        .conversation-item.active .conv-del { color: #ffb3b3; }
        .new-chat-btn {
            background: #16c79a !important;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.75rem;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .item-key { color: #666; }
        .list-item .item-val { color: #333; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-empty { color: #999; font-size: 0.75rem; text-align: center; padding: 0.5rem; }
        .message-actions {
            margin-top: 0.375rem;
            display: flex;
            gap: 0.5rem;
        }
        .message-actions button {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            background: #e0e0e0;
            color: #333;
            width: auto;
        }
        .message-actions button:hover { background: #d0d0d0; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 360px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .modal-box h3 { margin: 0; font-size: 1rem; }
        .modal-box input, .modal-box select {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            width: 100%;
        }
        .modal-box .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        .modal-box .modal-actions button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .modal-box .modal-actions .btn-cancel { background: #e0e0e0; color: #333; }
        .modal-box .modal-actions .btn-save { background: #1a1a2e; color: #fff; }
        .script-section { font-size: 0.8125rem; }
        .script-section summary { font-weight: 500; color: #555; cursor: pointer; user-select: none; }
        .script-list { display: flex; flex-direction: column; gap: 0.375rem; }
        .script-item {
            padding: 0.5rem 0.625rem;
            border-radius: 0.5rem;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: background 0.15s;
        }
        .script-item:hover { background: #eee; }
        .script-item .script-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.25rem;
        }
        .script-item .script-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
        }
        .script-item .script-type {
            font-size: 0.7rem;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            background: #1a1a2e;
            color: #fff;
            white-space: nowrap;
        }
        .script-item .script-rating {
            font-size: 0.75rem;
            color: #f5a623;
        }
        .script-item .script-time {
            font-size: 0.7rem;
            color: #888;
        }
        .script-item .script-actions {
            display: flex;
            gap: 0.375rem;
            margin-top: 0.375rem;
        }
        .script-item .script-actions button {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            width: auto;
        }
        .script-item .script-actions .btn-view { background: #1a1a2e; color: #fff; }
        .script-item .script-actions .btn-del { background: #e94560; color: #fff; }
        .script-item .script-detail {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #fff;
            border-radius: 0.375rem;
            font-size: 0.8125rem;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }
        .script-item .script-detail.collapsed { display: none; }
        .script-item .rating-bar {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.375rem;
        }
        .script-item .rating-bar span {
            cursor: pointer;
            font-size: 1rem;
            color: #ddd;
            transition: color 0.15s;
        }
        .script-item .rating-bar span.active { color: #f5a623; }
        .script-empty { color: #999; font-size: 0.75rem; text-align: center; padding: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .container { padding: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎤 Comedy Agent</h1>
        <div style="display:flex;align-items:center;gap:1rem;">
            <a href="/static/skills.html" style="color:#fff;text-decoration:none;font-size:0.875rem;opacity:0.8;transition:opacity 0.2s;">Skill 管理</a>
            <a href="/static/me.html" style="color:#fff;text-decoration:none;font-size:0.875rem;opacity:0.8;transition:opacity 0.2s;">我的</a>
            <span id="current-user" style="font-size:0.875rem;"></span>
            <button onclick="logout()" style="font-size:0.75rem;padding:0.25rem 0.75rem;background:#e94560;color:#fff;border:none;border-radius:0.375rem;cursor:pointer;">退出</button>
            <span id="status" class="status">检查中...</span>
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <label for="model">模型</label>
            <select id="model">
                <option value="">加载中...</option>
            </select>

            <label for="user-id">当前用户</label>
            <input id="user-id" type="text" readonly style="background:#f0f0f0;cursor:default;">

            <button class="new-chat-btn" onclick="startNewChat()">➕ 新对话</button>

            <label>快捷指令</label>
            <button onclick="sendQuick('写一个关于职场加班的脱口秀')">🎤 职场脱口秀</button>
            <button onclick="sendQuick('写一段相声，主题是年轻人谈恋爱')">🎭 恋爱相声</button>
            <button onclick="sendQuick('创作一个小品剧本，关于相亲')">🎬 相亲小品</button>
            <button onclick="sendQuick('分析一下这段段子的笑点结构：老板说要给我加薪，结果是加工作量')">🔍 笑点分析</button>

            <label>历史会话</label>
            <div class="conversation-list" id="conversation-list">
                <div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">加载中...</div>
            </div>

        </aside>
        <main class="main">
            <div class="chat-area" id="chat-area">
                <div class="empty-state">
                    <h2>Comedy Agent</h2>
                    <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" placeholder="输入你的需求，按 Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </main>
    </div>

    <!-- 学习模式 Modal -->
    <div class="modal-overlay" id="learn-modal">
        <div class="modal-box" style="width: 560px; max-height: 90vh; overflow-y: auto;">
            <h3>📚 学习模式</h3>
            <select id="learn-mode" style="margin-bottom:0.5rem;">
                <option value="explain">💡 解释概念</option>
                <option value="analyze">🔍 分析案例笑点结构</option>
                <option value="extract">✂️ 提取可复用技巧</option>
            </select>
            <textarea id="learn-query" placeholder="输入你的问题，例如：分析一下这个案例的笑点结构" style="height:4rem;margin-bottom:0.5rem;"></textarea>
            <label style="font-size:0.75rem;color:#666;">选择参考文档（不选则检索全部）</label>
            <div id="learn-doc-select" style="max-height:100px;overflow-y:auto;font-size:0.75rem;margin-bottom:0.5rem;border:1px solid #ddd;border-radius:0.375rem;padding:0.5rem;">
                <span style="color:#999;">暂无文档</span>
            </div>
            <div id="learn-output" style="background:#f8f8f8;padding:0.75rem;border-radius:0.5rem;font-size:0.875rem;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto;display:none;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeLearnModal()">关闭</button>
                <button class="btn-save" onclick="sendLearnQuery()">分析</button>
            </div>
        </div>
    </div>

    <!-- 创建技巧卡片 Modal -->
    <div class="modal-overlay" id="create-card-modal">
        <div class="modal-box">
            <h3>新建技巧卡片</h3>
            <input type="text" id="card-title" placeholder="技巧名称" />
            <select id="card-type">
                <option value="technique">技巧</option>
                <option value="concept">概念</option>
                <option value="formula">公式</option>
                <option value="pattern">模式</option>
            </select>
            <input type="text" id="card-tags" placeholder="标签，用逗号分隔" />
            <textarea id="card-content" placeholder="技巧内容/说明" style="height:6rem;"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateCardModal()">取消</button>
                <button class="btn-save" onclick="confirmCreateCard()">保存</button>
            </div>
        </div>
    </div>

    <!-- 安装 Skill Modal -->
    <div class="modal-overlay" id="install-skill-modal">
        <div class="modal-box" style="width: 480px; max-height: 90vh; overflow-y: auto;">
            <h3>安装 Skill</h3>
            <input type="text" id="install-skill-name" placeholder="Skill 名称（只允许字母、数字、下划线、连字符）" />
            <textarea id="install-skill-md" placeholder="SKILL.md 内容"></textarea>
            <textarea id="install-skill-prompt" placeholder="prompt.txt 内容"></textarea>
            <textarea id="install-skill-py" placeholder="skill.py 代码内容（可选）"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeInstallSkillModal()">取消</button>
                <button class="btn-save" onclick="confirmInstallSkill()">安装</button>
            </div>
        </div>
    </div>

    <!-- 保存作品 Modal -->
    <div class="modal-overlay" id="save-script-modal">
        <div class="modal-box">
            <h3>保存为作品</h3>
            <input type="text" id="script-title" placeholder="作品标题" />
            <select id="script-type">
                <option value="">选择类型</option>
                <option value="standup">单口喜剧</option>
                <option value="crosstalk">相声</option>
                <option value="sketch">小品</option>
                <option value="sitcom">情景喜剧</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSaveModal()">取消</button>
                <button class="btn-save" onclick="confirmSaveScript()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script>
        const chatArea = document.getElementById('chat-area');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        let history = [];
        let currentSessionId = null;

        requireAuth();
        document.getElementById('user-id').value = getCurrentUserId() || '';
        document.getElementById('current-user').textContent = getCurrentUserId() || '';

        function startNewChat() {
            currentSessionId = null;
            history = [];
            chatArea.innerHTML = `
                <div class="empty-state">
                    <h2>Comedy Agent</h2>
                    <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                </div>
            `;
            renderConversationList();
        }

        async function loadConversations() {
            const listEl = document.getElementById('conversation-list');
            try {
                const res = await fetch(`${API_BASE}/conversations?limit=20`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._conversations = data.conversations || [];
                renderConversationList();
            } catch {
                listEl.innerHTML = '<div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">加载失败</div>';
            }
        }

        function renderConversationList() {
            const listEl = document.getElementById('conversation-list');
            const conversations = window._conversations || [];
            if (conversations.length === 0) {
                listEl.innerHTML = '<div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">暂无历史会话</div>';
                return;
            }
            listEl.innerHTML = '';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conversation-item' + (conv.session_id === currentSessionId ? ' active' : '');
                const title = conv.summary || '未命名会话';
                const time = conv.updated_at ? new Date(conv.updated_at).toLocaleDateString() : '';
                item.innerHTML = `<span class="conv-title" title="${title}">${title}</span><span style="font-size:0.7rem;color:#888;white-space:nowrap;">${time}</span><span class="conv-del" onclick="event.stopPropagation();deleteConversation('${conv.session_id}')">✕</span>`;
                item.onclick = () => loadConversation(conv.session_id);
                listEl.appendChild(item);
            });
        }

        async function loadConversation(sessionId) {
            try {
                const res = await fetch(`${API_BASE}/conversations/${sessionId}`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                currentSessionId = data.session_id;
                history = [];
                chatArea.innerHTML = '';
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        if (msg.role === 'human') {
                            appendMessage('user', msg.content);
                            history.push(['human', msg.content]);
                        } else if (msg.role === 'ai') {
                            appendMessage('agent', msg.content);
                            history.push(['ai', msg.content]);
                        }
                    });
                }
                if (chatArea.children.length === 0) {
                    chatArea.innerHTML = `
                        <div class="empty-state">
                            <h2>Comedy Agent</h2>
                            <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                        </div>
                    `;
                }
                renderConversationList();
            } catch (err) {
                alert('加载会话失败: ' + err.message);
            }
        }

        async function deleteConversation(sessionId) {
            if (!confirm('确定删除该会话？')) return;
            try {
                const res = await fetch(`${API_BASE}/conversations/${sessionId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                if (currentSessionId === sessionId) {
                    startNewChat();
                }
                loadConversations();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function loadDocuments() {
            const listEl = document.getElementById('document-list');
            try {
                const res = await fetch(`${API_BASE}/documents`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                const docs = data.documents || [];
                if (docs.length === 0) {
                    listEl.innerHTML = '<div class="list-empty">暂无文档</div>';
                    return;
                }
                listEl.innerHTML = '';
                docs.forEach(d => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    const statusColor = d.status === 'ingested' ? '#16c79a' : (d.status === 'failed' ? '#e94560' : '#999');
                    const statusText = d.status === 'ingested' ? '已入库' : (d.status === 'failed' ? '失败' : '处理中');
                    const errorTip = d.error_msg ? ` title="${d.error_msg.replace(/"/g, '&quot;')}"` : '';
                    item.innerHTML = `<span class="item-key" title="${d.filename}">${d.filename}</span><span style="color:${statusColor};font-size:0.7rem;"${errorTip}>${statusText}</span><span style="color:#e94560;cursor:pointer;font-size:0.75rem;" onclick="deleteDocument('${d.doc_id}')">✕</span>`;
                    listEl.appendChild(item);
                });
            } catch {
                listEl.innerHTML = '<div class="list-empty">加载失败</div>';
            }
        }

        async function uploadDocuments() {
            const input = document.getElementById('doc-upload-input');
            if (!input.files || input.files.length === 0) return;
            const formData = new FormData();
            for (const file of input.files) {
                formData.append('files', file);
            }
            try {
                const res = await fetch(`${API_BASE}/documents/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData,
                });
                if (!res.ok) throw new Error('上传失败');
                input.value = '';
                loadDocuments();
            } catch (err) {
                alert('上传失败: ' + err.message);
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('确定删除该文档？')) return;
            try {
                const res = await fetch(`${API_BASE}/documents/${docId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                loadDocuments();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        // 学习模式
        function openLearnModal() {
            document.getElementById('learn-modal').classList.add('active');
            renderLearnDocSelect();
        }
        function closeLearnModal() {
            document.getElementById('learn-modal').classList.remove('active');
            document.getElementById('learn-output').style.display = 'none';
            document.getElementById('learn-output').textContent = '';
        }
        async function renderLearnDocSelect() {
            const container = document.getElementById('learn-doc-select');
            try {
                const res = await fetch(`${API_BASE}/documents`, { headers: authHeaders() });
                const data = await res.json();
                const docs = data.documents || [];
                if (docs.length === 0) {
                    container.innerHTML = '<span style="color:#999;">暂无文档，请先上传</span>';
                    return;
                }
                container.innerHTML = '';
                docs.forEach(d => {
                    const label = document.createElement('label');
                    label.style.display = 'block';
                    label.style.marginBottom = '0.25rem';
                    label.innerHTML = `<input type="checkbox" class="learn-doc-checkbox" value="${d.doc_id}" /> ${escapeHtml(d.filename)}`;
                    container.appendChild(label);
                });
            } catch {
                container.innerHTML = '<span style="color:#999;">加载文档失败</span>';
            }
        }
        async function sendLearnQuery() {
            const query = document.getElementById('learn-query').value.trim();
            if (!query) { alert('请输入问题'); return; }
            const mode = document.getElementById('learn-mode').value;
            const checkboxes = document.querySelectorAll('.learn-doc-checkbox:checked');
            const doc_ids = Array.from(checkboxes).map(cb => cb.value);
            const outputEl = document.getElementById('learn-output');
            outputEl.style.display = 'block';
            outputEl.textContent = '分析中...';
            try {
                const res = await fetch(`${API_BASE}/learn/chat`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ query, mode, doc_ids: doc_ids.length ? doc_ids : null }),
                });
                const data = await res.json();
                if (res.ok) {
                    outputEl.textContent = data.output;
                } else {
                    outputEl.textContent = '错误: ' + (data.detail || '未知错误');
                }
            } catch (err) {
                outputEl.textContent = '请求失败: ' + err.message;
            }
        }

        // 技巧库
        function openCreateCardModal() {
            document.getElementById('create-card-modal').classList.add('active');
        }
        function closeCreateCardModal() {
            document.getElementById('create-card-modal').classList.remove('active');
            document.getElementById('card-title').value = '';
            document.getElementById('card-content').value = '';
            document.getElementById('card-tags').value = '';
        }
        async function confirmCreateCard() {
            const title = document.getElementById('card-title').value.trim();
            const content = document.getElementById('card-content').value.trim();
            if (!title || !content) { alert('请填写标题和内容'); return; }
            const card_type = document.getElementById('card-type').value;
            const tags = document.getElementById('card-tags').value.split(',').map(t => t.trim()).filter(Boolean);
            try {
                const res = await fetch(`${API_BASE}/learn/cards`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ user_id: currentUserId, title, content, card_type, tags }),
                });
                if (!res.ok) throw new Error('保存失败');
                closeCreateCardModal();
                loadKnowledgeCards();
            } catch (err) {
                alert('保存失败: ' + err.message);
            }
        }
        async function loadKnowledgeCards() {
            const listEl = document.getElementById('card-list');
            try {
                const res = await fetch(`${API_BASE}/learn/cards`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                const cards = data.cards || [];
                if (cards.length === 0) {
                    listEl.innerHTML = '<div class="list-empty">暂无卡片</div>';
                    return;
                }
                listEl.innerHTML = '';
                cards.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    item.style.flexDirection = 'column';
                    item.style.alignItems = 'flex-start';
                    item.style.gap = '0.25rem';
                    const typeLabel = { technique: '技巧', concept: '概念', formula: '公式', pattern: '模式' }[c.card_type] || c.card_type;
                    const tagsHtml = c.tags ? c.tags.map(t => `<span style="font-size:0.7rem;background:#eee;padding:0.125rem 0.375rem;border-radius:0.25rem;">${t}</span>`).join(' ') : '';
                    item.innerHTML = `<div style="display:flex;justify-content:space-between;width:100%;align-items:center;"><strong style="font-size:0.875rem;">${escapeHtml(c.title)}</strong><span style="font-size:0.7rem;color:#888;">${typeLabel}</span><span style="color:#e94560;cursor:pointer;font-size:0.75rem;" onclick="deleteKnowledgeCard('${c.card_id}')">✕</span></div><div style="font-size:0.75rem;color:#555;white-space:pre-wrap;">${escapeHtml(c.content)}</div><div style="display:flex;gap:0.25rem;flex-wrap:wrap;">${tagsHtml}</div>`;
                    listEl.appendChild(item);
                });
            } catch {
                listEl.innerHTML = '<div class="list-empty">加载失败</div>';
            }
        }
        async function deleteKnowledgeCard(cardId) {
            if (!confirm('确定删除该卡片？')) return;
            try {
                const res = await fetch(`${API_BASE}/learn/cards/${cardId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                loadKnowledgeCards();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        loadConversations();
        loadSkills();

        async function loadSkills() {
            const listEl = document.getElementById('skill-list');
            try {
                const res = await fetch(`${API_BASE}/skills`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._skills = data.skills || [];
                renderSkillList();
            } catch (err) {
                console.error('加载 Skill 失败:', err);
                listEl.innerHTML = '<div class="skill-empty">加载失败</div>';
            }
        }

        function renderSkillList() {
            const listEl = document.getElementById('skill-list');
            const skills = window._skills || [];
            if (skills.length === 0) {
                listEl.innerHTML = '<div class="skill-empty">暂无 Skill</div>';
                return;
            }
            listEl.innerHTML = '';
            skills.forEach(s => {
                const item = document.createElement('div');
                item.className = 'skill-item';
                const sourceClass = s.source === 'builtin' ? 'builtin' : 'plugin';
                const sourceLabel = s.source === 'builtin' ? '内置' : '插件';
                const uninstallBtn = s.source === 'builtin'
                    ? ''
                    : `<button onclick="uninstallSkill('${s.name}')">卸载</button>`;
                item.innerHTML = `
                    <span class="skill-name" title="${s.description || ''}">${s.name}</span>
                    <span class="skill-meta">
                        <span class="skill-type">${s.task_type || ''}</span>
                        <span class="skill-source ${sourceClass}">${sourceLabel}</span>
                        ${uninstallBtn}
                    </span>
                `;
                listEl.appendChild(item);
            });
        }

        function openInstallSkillModal() {
            document.getElementById('install-skill-name').value = '';
            document.getElementById('install-skill-md').value = '';
            document.getElementById('install-skill-prompt').value = '';
            document.getElementById('install-skill-py').value = '';
            document.getElementById('install-skill-modal').classList.add('active');
        }

        function closeInstallSkillModal() {
            document.getElementById('install-skill-modal').classList.remove('active');
        }

        async function confirmInstallSkill() {
            const name = document.getElementById('install-skill-name').value.trim();
            const skillMd = document.getElementById('install-skill-md').value.trim();
            const promptTxt = document.getElementById('install-skill-prompt').value.trim();
            const skillPy = document.getElementById('install-skill-py').value.trim() || null;

            if (!name) { alert('请输入 Skill 名称'); return; }
            if (!skillMd) { alert('请输入 SKILL.md 内容'); return; }
            if (!promptTxt) { alert('请输入 prompt.txt 内容'); return; }

            try {
                const res = await fetch(`${API_BASE}/skills/install`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ name, skill_md: skillMd, prompt_txt: promptTxt, skill_py: skillPy }),
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || '安装失败');
                }
                closeInstallSkillModal();
                loadSkills();
                alert('Skill 安装成功');
            } catch (err) {
                alert('安装失败: ' + err.message);
            }
        }

        async function uninstallSkill(name) {
            if (!confirm(`确定卸载 Skill「${name}」？`)) return;
            try {
                const res = await fetch(`${API_BASE}/skills/${encodeURIComponent(name)}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || '卸载失败');
                }
                loadSkills();
                alert('Skill 已卸载');
            } catch (err) {
                alert('卸载失败: ' + err.message);
            }
        }

        async function reloadSkills() {
            try {
                const res = await fetch(`${API_BASE}/skills/reload`, {
                    method: 'POST',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('热重载失败');
                const data = await res.json();
                loadSkills();
                alert(`热重载完成：新增 ${data.added} 个，移除 ${data.removed} 个，未变更 ${data.unchanged} 个`);
            } catch (err) {
                alert('热重载失败: ' + err.message);
            }
        }

        async function loadScripts() {
            const listEl = document.getElementById('script-list');
            try {
                const res = await fetch(`${API_BASE}/scripts`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._scripts = data.scripts || [];
                renderScriptList();
            } catch (err) {
                console.error('加载作品失败:', err);
                listEl.innerHTML = '<div class="script-empty">加载失败</div>';
            }
        }

        function renderScriptList() {
            const listEl = document.getElementById('script-list');
            const scripts = window._scripts || [];
            if (scripts.length === 0) {
                listEl.innerHTML = '<div class="script-empty">暂无作品</div>';
                return;
            }
            listEl.innerHTML = '';
            scripts.forEach(s => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.id = `script-item-${s.script_id}`;
                const title = s.title || '未命名作品';
                const typeLabel = s.script_type || '作品';
                const time = s.updated_at ? new Date(s.updated_at).toLocaleDateString() : '';
                const rating = s.rating != null ? Math.round(s.rating) : 0;
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<span class="${i <= rating ? 'active' : ''}" onclick="event.stopPropagation();rateScript('${s.script_id}', ${i})">★</span>`;
                }
                item.innerHTML = `
                    <div class="script-header" onclick="viewScript('${s.script_id}')">
                        <span class="script-title" title="${title}">${title}</span>
                        <span class="script-type">${typeLabel}</span>
                        <span class="script-rating">${starsHtml}</span>
                        <span class="script-time">${time}</span>
                    </div>
                    <div class="script-detail collapsed" id="script-detail-${s.script_id}">${escapeHtml(s.content)}</div>
                    <div class="script-actions">
                        <button class="btn-view" onclick="viewScript('${s.script_id}')">查看</button>
                        <button class="btn-del" onclick="deleteScript('${s.script_id}')">删除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function viewScript(scriptId) {
            const detail = document.getElementById(`script-detail-${scriptId}`);
            if (detail) {
                detail.classList.toggle('collapsed');
            }
        }

        async function deleteScript(scriptId) {
            if (!confirm('确定删除该作品？')) return;
            try {
                const res = await fetch(`${API_BASE}/scripts/${scriptId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                loadScripts();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function rateScript(scriptId, rating) {
            try {
                const res = await fetch(`${API_BASE}/scripts/${scriptId}/rate`, {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify({ rating: rating }),
                });
                if (!res.ok) throw new Error('评分失败');
                // 更新本地数据并重新渲染
                const s = (window._scripts || []).find(x => x.script_id === scriptId);
                if (s) s.rating = rating;
                renderScriptList();
            } catch (err) {
                alert('评分失败: ' + err.message);
            }
        }

        async function loadModels() {
            const select = document.getElementById('model');
            try {
                const res = await fetch(`${API_BASE}/models`, { headers: authHeaders() });
                const data = await res.json();
                select.innerHTML = '';

                const models = data.models || [];
                const recommended = data.recommended;

                if (models.length === 0) {
                    select.innerHTML = '<option value="">无可用模型</option>';
                    return;
                }

                // 添加"默认"选项
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = recommended
                    ? `默认（${formatModelName(recommended)}）`
                    : '默认';
                select.appendChild(defaultOpt);

                models.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = formatModelName(name);
                    if (name === recommended) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            } catch {
                select.innerHTML = '<option value="">模型加载失败</option>';
            }
        }

        function formatModelName(name) {
            const map = {
                'gpt-4o': 'GPT-4o',
                'gpt-4o-mini': 'GPT-4o Mini',
                'gpt-4-turbo': 'GPT-4 Turbo',
                'claude-3-5-sonnet': 'Claude 3.5 Sonnet',
                'claude-3-opus': 'Claude 3 Opus',
                'claude-3-5-haiku': 'Claude 3.5 Haiku',
                'qwen-max': '通义千问 Max',
                'qwen-plus': '通义千问 Plus',
                'qwen-turbo': '通义千问 Turbo',
                'qwen-long': '通义千问 Long',
                'kimi-for-coding': 'Kimi',
                'kimi-code': 'Kimi Code',
                'kimi-k2.6': 'Kimi K2.6',
                'kimi-k2.5': 'Kimi K2.5',
                'deepseek-v4-pro': 'DeepSeek V4 Pro',
                'deepseek-v4-flash': 'DeepSeek V4 Flash',
                'deepseek-v3.1': 'DeepSeek V3.1',
                'deepseek-v3': 'DeepSeek V3',
                'glm-5': 'GLM-5',
                'glm-5.1': 'GLM-5.1',
                'qwen3.5-397b': 'Qwen3.5 397B',
                'qwen3.5-plus': 'Qwen3.5 Plus',
                'qwen3.5-flash': 'Qwen3.5 Flash',
                'qwen3-max': 'Qwen3 Max',
                'qwen3-coder': 'Qwen3 Coder',
                'minimax-m2.5': 'MiniMax M2.5',
                'minimax-m2.7': 'MiniMax M2.7',
                'gpt-oss-120b': 'GPT-OSS 120B',
                'qwq-plus': 'QwQ Plus',
                'mimo-v2.5-pro': 'Mimo V2.5 Pro',
                'ollama-llama3': 'Ollama Llama3',
                'ollama-llama3.1': 'Ollama Llama3.1',
                'ollama-qwen2.5': 'Ollama Qwen2.5',
            };
            return map[name] || name;
        }

        checkHealth('status');
        loadModels();
        setInterval(() => checkHealth('status'), 30000);

        let _pendingScriptContent = '';

        function appendMessage(role, text, model, suggestion) {
            const empty = chatArea.querySelector('.empty-state');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            let actionsHtml = '';
            let metaHtml = `<div class="meta">${role === 'user' ? '你' : 'Agent'}</div>`;
            if (role === 'agent') {
                const modelTag = model ? `<span class="model-tag">${escapeHtml(formatModelName(model))}</span>` : '';
                metaHtml = `<div class="meta">Agent ${modelTag}</div>`;
                actionsHtml = `<div class="message-actions"><button onclick="copyMessage(this)" data-content="${escapeHtml(text).replace(/"/g, '&quot;')}">📋 复制</button><button onclick="openSaveModal(this)" data-content="${escapeHtml(text).replace(/"/g, '&quot;')}">💾 保存为作品</button></div>`;

                if (suggestion && suggestion.available_styles && suggestion.available_styles.length > 0) {
                    const styleTags = suggestion.available_styles.map(s =>
                        `<span class="style-tag" onclick="sendStyleRefinement(this)"
                              data-skill="${escapeHtml(suggestion.skill_name || '')}"
                              data-topic="${escapeHtml(suggestion.topic || '')}"
                              data-template="${escapeHtml(suggestion.prompt_template || '')}">${escapeHtml(s)}</span>`
                    ).join('');
                    actionsHtml += `<div class="suggestion-bar">
                        <span class="suggestion-label">💡 是否更加风格化？</span>
                        <span class="suggestion-hint">当前支持：</span>${styleTags}
                    </div>`;
                }
            }
            div.innerHTML = `${metaHtml}${escapeHtml(text)}${actionsHtml}`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function sendStyleRefinement(el) {
            const skill = el.getAttribute('data-skill');
            const topic = el.getAttribute('data-topic');
            const template = el.getAttribute('data-template');
            const style = el.textContent;

            const prompt = template
                .replace('{skill_name}', skill)
                .replace('{topic}', topic)
                .replace('{style}', style);

            input.value = prompt;
            sendMessage();
        }

        function copyMessage(btn) {
            const content = btn.getAttribute('data-content') || '';
            navigator.clipboard.writeText(content).then(() => {
                const original = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = original; }, 2000);
            }).catch(() => {
                alert('复制失败');
            });
        }

        function openSaveModal(btn) {
            _pendingScriptContent = btn.getAttribute('data-content') || '';
            document.getElementById('script-title').value = '';
            document.getElementById('script-type').value = '';
            document.getElementById('save-script-modal').classList.add('active');
        }

        function closeSaveModal() {
            document.getElementById('save-script-modal').classList.remove('active');
            _pendingScriptContent = '';
        }

        async function confirmSaveScript() {
            const title = document.getElementById('script-title').value.trim();
            const type = document.getElementById('script-type').value;
            if (!title) {
                alert('请输入作品标题');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/scripts`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        user_id: currentUserId,
                        title: title,
                        content: _pendingScriptContent,
                        script_type: type || null,
                    }),
                });
                if (!res.ok) throw new Error('保存失败');
                closeSaveModal();
                loadScripts();
                alert('作品已保存到「我的作品」');
            } catch (err) {
                alert('保存失败: ' + err.message);
            }
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            input.disabled = loading;
            if (loading) {
                const typing = document.createElement('div');
                typing.className = 'typing';
                typing.id = 'typing-indicator';
                typing.textContent = 'Agent 正在思考...';
                chatArea.appendChild(typing);
                chatArea.scrollTop = chatArea.scrollHeight;
            } else {
                const t = document.getElementById('typing-indicator');
                if (t) t.remove();
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            const model = document.getElementById('model').value || null;

            input.value = '';
            appendMessage('user', text);
            setLoading(true);

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        prompt: text,
                        model: model,
                        session_id: currentSessionId,
                        chat_history: history,
                    }),
                });
                const data = await res.json();
                if (res.ok) {
                    appendMessage('agent', data.output, data.model, data.suggestion);
                    history.push(['human', text]);
                    history.push(['ai', data.output]);
                    if (history.length > 20) history = history.slice(-20);
                    currentSessionId = data.session_id || currentSessionId;
                    loadConversations();
                } else {
                    appendMessage('agent', `错误: ${data.detail || '未知错误'}`);
                }
            } catch (err) {
                appendMessage('agent', `请求失败: ${err.message}`);
            } finally {
                setLoading(false);
            }
        }

        function sendQuick(text) {
            input.value = text;
            sendMessage();
        }
    </script>
