<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Comedy Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 1.5rem;
            text-align: center;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab.active {
            color: #1a1a2e;
            border-bottom-color: #1a1a2e;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 0.375rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error {
            color: #e94560;
            font-size: 0.875rem;
            margin-top: 0.75rem;
            text-align: center;
            min-height: 1.25rem;
        }
        .success {
            color: #16c79a;
            font-size: 0.875rem;
            margin-top: 0.75rem;
            text-align: center;
            min-height: 1.25rem;
        }
        .hint {
            text-align: center;
            font-size: 0.8125rem;
            color: #888;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎤 Comedy Agent</h1>
    </header>
    <div class="main">
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')" id="tab-login">登录</div>
                <div class="tab" onclick="switchTab('register')" id="tab-register">注册</div>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-user-id">用户 ID</label>
                    <input id="login-user-id" type="text" placeholder="请输入用户 ID" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input id="login-password" type="password" placeholder="请输入密码" required>
                </div>
                <button class="btn" type="submit" id="login-btn">登录</button>
                <div class="error" id="login-error"></div>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-group">
                    <label for="reg-user-id">用户 ID</label>
                    <input id="reg-user-id" type="text" placeholder="请输入用户 ID" required minlength="1" maxlength="64">
                </div>
                <div class="form-group">
                    <label for="reg-nickname">昵称（可选）</label>
                    <input id="reg-nickname" type="text" placeholder="请输入昵称">
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input id="reg-password" type="password" placeholder="至少 4 位字符" required minlength="4">
                </div>
                <div class="form-group">
                    <label for="reg-password2">确认密码</label>
                    <input id="reg-password2" type="password" placeholder="再次输入密码" required>
                </div>
                <button class="btn" type="submit" id="register-btn">注册</button>
                <div class="error" id="register-error"></div>
                <div class="success" id="register-success"></div>
            </form>

            <div class="hint">登录后即可使用 Comedy Agent 进行喜剧创作</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function switchTab(tab) {
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('login-error').textContent = '';
            document.getElementById('register-error').textContent = '';
            document.getElementById('register-success').textContent = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            btn.disabled = true;
            errorEl.textContent = '';

            const userId = document.getElementById('login-user-id').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    window.location.href = '/static/index.html';
                } else {
                    errorEl.textContent = data.detail || '登录失败';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            btn.disabled = true;
            errorEl.textContent = '';
            successEl.textContent = '';

            const userId = document.getElementById('reg-user-id').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim() || null;
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;

            if (password !== password2) {
                errorEl.textContent = '两次输入的密码不一致';
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, password, nickname }),
                });
                const data = await res.json();
                if (res.ok) {
                    successEl.textContent = '注册成功，请登录';
                    setTimeout(() => switchTab('login'), 800);
                } else {
                    errorEl.textContent = data.detail || '注册失败';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
