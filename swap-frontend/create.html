<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发起交换 — 喜剧换 · Comedy Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="swap-common.css">
<style>
.create-grid{display:grid;grid-template-columns:1fr;max-width:720px;margin:26px auto 0}
.create-card{padding:32px 34px}
.create-card h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3vw,30px);margin-bottom:6px;letter-spacing:.03em}
.create-sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo">喜剧<em>换</em></span>
    <span class="sub">COMEDY SWAP</span>
  </a>
  <div class="mid">
    <a class="btn-ghost btn-sm" href="index.html">← 返回市场</a>
  </div>
  <div class="auth-area" id="auth-area"></div>
</header>

<main class="page-wrap" style="max-width:840px;">
  <div class="card create-grid create-card">
    <h1>发起一次交换</h1>
    <p class="create-sub">说清楚你提供什么、想换什么，感兴趣的喜剧人会带着 offer 来找你。</p>

    <form id="create-form" onsubmit="submitCreate(event)">
      <div class="field">
        <label for="f-title">标题 <span class="char-count" id="title-count">0/128</span></label>
        <input id="f-title" type="text" maxlength="128" placeholder="一句话说清这次交换，例如：三节开放麦名额换海报设计" oninput="updateTitleCount()">
      </div>
      <div class="field">
        <label for="f-offer">我提供什么</label>
        <textarea id="f-offer" rows="4" placeholder="物品 / 服务 / 技能的详细描述…"></textarea>
      </div>
      <div class="field">
        <label for="f-want">想换什么</label>
        <textarea id="f-want" rows="4" placeholder="你希望得到什么…"></textarea>
      </div>
      <div class="field">
        <label>图片（1-3 张）</label>
        <div class="upload-row" id="create-upload-row"></div>
      </div>
      <button class="btn-primary btn-block" type="submit" id="create-btn">发 布 交 换</button>
    </form>
  </div>
</main>

<footer class="footer">
  <a href="index.html">交换市场</a><span class="sep">·</span>
  <span>喜剧换 · Comedy Swap</span>
</footer>

<script src="common.js"></script>
<script>
let images = []; // 已上传图片 url（1-3 张）

function updateTitleCount() {
    const el = document.getElementById('f-title');
    const cnt = document.getElementById('title-count');
    cnt.textContent = el.value.length + '/128';
    cnt.classList.toggle('over', el.value.length >= 128);
}

function renderUploadRow() {
    const row = document.getElementById('create-upload-row');
    let html = images.map((u, i) => `
        <div class="upload-thumb">
          <img src="${escapeHtml(u)}" alt="" onerror="this.parentNode.remove()">
          <span class="del" onclick="removeImage(${i})">×</span>
        </div>`).join('');
    if (images.length < 3) {
        html += `
        <label class="upload-add" id="upload-add-btn">
          ＋<span>传图</span>
          <input type="file" accept="image/*" style="display:none;" onchange="handleImage(this)">
        </label>`;
    }
    row.innerHTML = html;
}

async function handleImage(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (images.length >= 3) { toast('最多 3 张图', 'warn'); return; }
    const addBtn = document.getElementById('upload-add-btn');
    try {
        if (addBtn) addBtn.innerHTML = '<div class="upload-loading">上传中</div>';
        const url = await uploadSwapImage(file);
        if (url) images.push(url);
    } catch (e) {
        toast('图片上传失败：' + e.message, 'error');
    } finally {
        renderUploadRow();
    }
    input.value = '';
}

function removeImage(i) {
    images.splice(i, 1);
    renderUploadRow();
}

async function submitCreate(e) {
    e.preventDefault();
    if (!requireAuth()) return;
    const btn = document.getElementById('create-btn');
    const title = document.getElementById('f-title').value.trim();
    const offerDesc = document.getElementById('f-offer').value.trim();
    const wantDesc = document.getElementById('f-want').value.trim();
    if (!title) { toast('请填写标题', 'warn'); return; }
    if (!offerDesc) { toast('请描述你提供什么', 'warn'); return; }
    if (!wantDesc) { toast('请描述想换什么', 'warn'); return; }

    btn.disabled = true;
    try {
        const res = await apiFetch('/swap/orders', {
            method: 'POST',
            body: JSON.stringify({ title, offer_desc: offerDesc, want_desc: wantDesc, images }),
        });
        const data = await res.json();
        const id = data.order_id ?? data.id;
        toast('发布成功 🎉', 'success');
        if (id != null) {
            window.location.href = 'order.html?id=' + encodeURIComponent(id);
        } else {
            window.location.href = 'index.html';
        }
    } catch (err) {
        toast('发布失败：' + err.message, 'error');
        btn.disabled = false;
    }
}

renderAuthArea();
renderUploadRow();
updateTitleCount();
</script>
</body>
</html>
