[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comedy-agent"
version = "0.1.0"
description = "喜剧行业垂直 Agent —— 基于 LangChain 的一体化创作框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Comedy Agent Team" }
]
keywords = ["agent", "langchain", "comedy", "rag", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Agent 框架核心
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    # 向量数据库
    "chromadb>=0.5.0",
    # HTTP 框架与 API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # 文档解析（RAG 阶段）
    "unstructured>=0.14.0",
    "python-magic>=0.4.27",
    # 工具与配置
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # 检索增强
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    # 缓存与存储
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # 可观测性
    "langsmith>=0.1.0",
    # 多平台发布
    "bilitool>=0.1.3",
    # 素材搜索
    "duckduckgo-search>=5.0.0",
    "jieba>=0.42.0",
    # 二维码生成
    "qrcode[pil]>=7.0",
    # 加密货币打赏（钱包签名与链上校验）
    "web3>=6.0.0",
    "eth-account>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
comedy-agent = "comedy_agent.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
