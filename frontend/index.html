<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCN-AI Agent｜模式入口</title>
    <link rel="stylesheet" href="/static/common.css">
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            margin: 0;
            background: #f5f6f8;
            min-height: 100vh;
        }
        header {
            background: #0f3b5c;
            color: #fff;
            text-align: center;
            padding: 16px;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 20px;
        }
        .sidebar {
            width: 200px;
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .sidebar a {
            display: block;
            padding: 10px 12px;
            margin-bottom: 6px;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .sidebar a:hover {
            background: #f0f0f0;
        }
        .sidebar a.active {
            background: #2c7da0;
            color: #fff;
        }
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-content: start;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            color: #0f3b5c;
            margin-top: 0;
            font-size: 1.25rem;
        }
        .card p {
            color: #555;
            line-height: 1.6;
        }
        .card .badge {
            display: inline-block;
            background: #2c7da0;
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .btn {
            background: #2c7da0;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9375rem;
            margin-top: 12px;
        }
        .btn:hover {
            background: #1f5a75;
        }
        .token-card {
            background: #0f3b5c;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
        }
        .token-card .token-balance {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5a623;
        }
        .token-card .token-label {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 4px;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: auto; }
            .main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header>
    <h1>MCN-AI Agent｜模式入口</h1>
</header>
<div class="container">
    <div class="sidebar">
        <div class="token-card">
            <div class="token-balance" id="token-balance">--</div>
            <div class="token-label">Token 余额</div>
        </div>
        <a class="active" onclick="goHome()">🏠 首页</a>
        <a onclick="goSpeed()">⚡ 极速版</a>
        <a onclick="goPro()">🎬 专业版</a>
        <a onclick="goSkills()">🧩 Skill市场</a>
        <a onclick="goMe()">👤 我的</a>
    </div>
    <div class="main">
        <div class="card">
            <span class="badge">极速版</span>
            <h3>趣味表达引擎</h3>
            <p><strong>加点料，不改味</strong></p>
            <p>适合轻量化改稿、加梗、IP 风格化二创。输入任意文案，一键生成带有趣味表达的短视频脚本。</p>
            <p>✅ 保留原意 ✅ 自动加梗 ✅ IP 角色风格化</p>
            <button class="btn" onclick="goSpeed()">进入极速版 →</button>
        </div>
        <div class="card">
            <span class="badge" style="background:#e94560;">专业版</span>
            <h3>剧本工坊</h3>
            <p><strong>人物画像 + Skill 组合</strong></p>
            <p>适合系统化剧本创作、分镜、台词生成。基于人物画像写作规则，组合话题/态度/情绪/风格 Skill，输出高质量结构化剧本。</p>
            <p>✅ 人物画像约束 ✅ 多 Skill 组合 ✅ Markdown 剧本输出</p>
            <button class="btn" style="background:#e94560;" onclick="goPro()">进入专业版 →</button>
        </div>
    </div>
</div>
<script src="/static/common.js"></script>
<script>
    requireAuth();
    async function loadTokenBalance() {
        try {
            const res = await apiFetch('/me/wallet');
            const data = await res.json();
            document.getElementById('token-balance').textContent = data.balance ?? '--';
        } catch {
            document.getElementById('token-balance').textContent = '--';
        }
    }
    loadTokenBalance();
</script>
</body>
</html>
