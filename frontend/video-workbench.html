<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脱口秀视频工作台</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#343434;
  --muted:#888b92;
  --light:#f5f6f8;
  --line:#eceef2;
  --line-dark:#dfe2e7;
  --orange:#ff764a;
  --green:#18a058;
  --red:#ff4a4a;
  --shadow:0 18px 50px rgba(20,26,38,.10);
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:15px;letter-spacing:.02em;
}
.app{height:100vh;display:flex;flex-direction:column;background:#fff;position:relative;}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}

/* Topbar */
.topbar{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px 0 26px;border-bottom:1px solid rgba(238,240,244,.45);position:relative;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.title{text-align:center;font-size:20px;font-weight:760;color:#232323;}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:18px;color:#333;font-weight:620;}
.action{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:16px;padding:9px 10px;transition:.24s cubic-bezier(.2,.8,.2,1);text-decoration:none;color:inherit;}
.action:hover{background:#f7f8fa;transform:translateY(-1px)}
.back-btn{justify-self:start;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:650;}
.back-btn:hover{color:var(--orange);}

/* Nav sidebar */
.nav-sidebar{position:absolute;left:0;top:76px;bottom:0;width:56px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:8px;z-index:15;}
.nav-sidebar a{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#6f737a;text-decoration:none;font-size:18px;transition:.2s;}
.nav-sidebar a:hover{background:#f0f1f4;}
.nav-sidebar a.active{background:#fff2ed;color:#ff764a;}

/* Main layout */
.main{flex:1;min-height:0;padding-left:56px;overflow:hidden;display:flex;}
.workbench{display:flex;width:100%;height:100%;}

/* Left config panel */
.config-panel{width:380px;min-width:340px;max-width:440px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden;}
.config-header{padding:20px 22px 14px;border-bottom:1px solid var(--line);}
.config-header h2{margin:0;font-size:18px;font-weight:780;color:#232323;}
.config-header p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.config-body{flex:1;overflow-y:auto;padding:20px 22px;}
.config-section{margin-bottom:22px;}
.config-section h3{margin:0 0 12px;font-size:14px;font-weight:760;color:#232323;display:flex;align-items:center;gap:8px;}

.script-preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;color:#444;max-height:120px;overflow-y:auto;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:13px;font-weight:650;color:#555;margin-bottom:6px;}
.form-row select,.form-row input[type=range],.form-row input[type=text],.form-row textarea{width:100%;padding:10px 12px;border:1px solid var(--line-dark);border-radius:10px;font-size:14px;background:#fff;outline:none;}
.form-row select:focus,.form-row textarea:focus{border-color:var(--orange);}
.form-row textarea{resize:vertical;min-height:80px;font-family:inherit;}

.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle-wrap input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);}

.generate-btn{width:100%;padding:14px 16px;background:var(--orange);color:#fff;border-radius:12px;font-size:15px;font-weight:780;transition:.2s;margin-top:8px;}
.generate-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.generate-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* Stage timeline */
.timeline{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.timeline-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;color:#555;}
.timeline-item.active{background:#fff7f4;border-color:#ffd4c5;color:#232323;}
.timeline-item.done{background:#e6fffb;border-color:#b7eb8f;color:#232323;}
.timeline-item.failed{background:#fff1f0;border-color:#ffa39e;color:#cf1322;}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--line-dark);}
.timeline-item.active .timeline-dot{background:var(--orange);}
.timeline-item.done .timeline-dot{background:var(--green);}
.timeline-item.failed .timeline-dot{background:var(--red);}

/* Right preview area */
.preview-panel{flex:1;background:#fff;display:flex;flex-direction:column;height:100%;overflow:hidden;}
.preview-header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.preview-header h3{margin:0;font-size:16px;font-weight:760;color:#232323;}
.preview-body{flex:1;overflow-y:auto;padding:24px;}

.empty-state{text-align:center;color:var(--muted);padding:80px 20px;}
.empty-state .big{font-size:56px;margin-bottom:14px;}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.error-box{background:#fff1f0;border:1px solid #ffa39e;border-radius:12px;padding:16px;color:#cf1322;margin-top:16px;}
.success-box{background:#e6fffb;border:1px solid #b7eb8f;border-radius:12px;padding:16px;color:#006d75;margin-top:16px;}

/* Scene editor */
.scene-list{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
.scene-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
.scene-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.scene-card-title{font-size:14px;font-weight:760;color:#232323;}
.scene-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f5f6f8;border-radius:10px;margin-bottom:12px;}
.scene-field{margin-bottom:12px;}
.scene-field label{display:block;font-size:12px;font-weight:650;color:#555;margin-bottom:6px;}
.scene-field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-dark);border-radius:10px;font-size:14px;font-family:inherit;min-height:60px;resize:vertical;outline:none;}
.scene-field textarea:focus{border-color:var(--orange);}
.scene-actions{display:flex;gap:8px;flex-wrap:wrap;}
.scene-actions button,.scene-actions a{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{filter:brightness(1.05);}
.btn-orange:disabled{opacity:.5;cursor:not-allowed;}
.btn-gray{background:#fafbfc;color:#333;border:1px solid var(--line-dark);}
.btn-gray:hover{background:#f5f6f8;}

/* Stage action bar */
.stage-actions{display:flex;gap:12px;justify-content:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);}
.stage-actions button,.stage-actions a{padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;}

/* AI prompt inline */
.ai-box{background:#fff7f4;border:1px solid #ffd4c5;border-radius:12px;padding:14px;margin-bottom:16px;}
.ai-box label{display:block;font-size:12px;font-weight:650;color:#555;margin-bottom:6px;}
.ai-box input{width:100%;padding:10px 12px;border:1px solid var(--line-dark);border-radius:10px;font-size:14px;}

/* Video player */
.video-box{background:#000;border-radius:16px;overflow:hidden;max-width:420px;margin:0 auto 20px;box-shadow:var(--shadow);}
.video-box video{width:100%;display:block;}

@media(max-width:900px){
  .workbench{flex-direction:column;}
  .config-panel{width:100%;max-width:none;height:auto;border-right:0;border-bottom:1px solid var(--line);}
  .preview-panel{height:auto;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-btn" onclick="goBack()">← 返回评测</a>
    <div class="title">🎬 脱口秀视频工作台</div>
    <div class="actions">
      <a class="action" href="/static/video-list.html"><span>📹 我的视频</span></a>
      <button class="action" onclick="logout()">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#41454b" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>退出</span>
      </button>
    </div>
  </header>

  <nav class="nav-sidebar">
    <a href="/static/index.html" title="首页">🏠</a>
    <a href="/static/speed.html" title="极速版">⚡</a>
    <a href="/static/pro-b.html" title="专业版" style="display:none;">🎬</a>
    <a href="/static/eval.html" title="笑果评测">🎯</a>
    <a href="/static/eval-square.html" title="段子广场">🏛️</a>
    <a href="/static/video-list.html" title="我的视频">📹</a>
    <a href="/static/me.html" title="我的">👤</a>
  </nav>

  <main class="main">
    <div class="workbench">
      <aside class="config-panel">
        <div class="config-header">
          <h2>视频配置</h2>
          <p>基于下方段子生成一段短视频</p>
        </div>
        <div class="config-body">
          <div class="config-section">
            <h3>📝 段子原文</h3>
            <div class="script-preview" id="script-preview">加载中...</div>
          </div>

          <div class="config-section">
            <h3>🎨 视觉风格</h3>
            <div class="form-row">
              <label>风格预设</label>
              <select id="style-select">
                <option value="illustration">插画治愈风</option>
                <option value="comic">漫画吐槽风</option>
                <option value="minimal">极简文字风</option>
              </select>
            </div>
          </div>

          <div class="config-section">
            <h3>🔊 配音</h3>
            <div class="form-row">
              <div class="toggle-wrap">
                <input type="checkbox" id="tts-enabled" checked>
                <label for="tts-enabled" style="margin:0;">启用 AI 配音</label>
              </div>
            </div>
            <div class="form-row">
              <label>音色</label>
              <select id="tts-voice"></select>
            </div>
          </div>

          <div class="config-section">
            <h3>⏱️ 节奏</h3>
            <div class="form-row">
              <label>语速/节奏</label>
              <select id="pace-select">
                <option value="normal">标准</option>
                <option value="slow">舒缓</option>
                <option value="fast">紧凑</option>
              </select>
            </div>
            <div class="form-row">
              <label>最大镜头数</label>
              <select id="max-scenes">
                <option value="3">3 个</option>
                <option value="5" selected>5 个</option>
                <option value="7">7 个</option>
              </select>
            </div>
          </div>

          <div class="config-section">
            <h3>📍 生成节点</h3>
            <div class="timeline" id="timeline"></div>
          </div>

          <button class="generate-btn" id="start-btn" onclick="startFirstStage()">开始第一步：剧本分镜</button>
          <div id="error-box"></div>
        </div>
      </aside>

      <section class="preview-panel">
        <div class="preview-header">
          <h3 id="preview-title">生成进度与预览</h3>
          <span id="job-status" style="font-size:13px;color:var(--muted);"></span>
        </div>
        <div class="preview-body" id="preview-body">
          <div class="empty-state">
            <div class="big">🎬</div>
            <p>配置完成后点击左侧「开始第一步：剧本分镜」</p>
            <p style="font-size:13px;">每个节点跑完后会自动暂停，供你检查、修改或让 AI 优化。</p>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/static/common.js"></script>
<script>
requireAuth();

const params = new URLSearchParams(window.location.search);
const resultId = params.get('result_id');
let currentJob = null;
let pollTimer = null;
let isRunning = false;

if (!resultId) {
  alert('缺少 result_id');
  goEval();
}

const TTS_VOICES = [
  {value:'zh-CN-XiaoxiaoNeural',label:'晓晓（女声）',group:'女声'},
  {value:'zh-CN-XiaoyiNeural',label:'晓伊（女声）',group:'女声'},
  {value:'zh-CN-XiaochenNeural',label:'晓辰（女声）',group:'女声'},
  {value:'zh-CN-XiaohanNeural',label:'晓涵（女声）',group:'女声'},
  {value:'zh-CN-XiaomengNeural',label:'晓梦（女声·卡通）',group:'女声'},
  {value:'zh-CN-XiaomoNeural',label:'晓墨（女声）',group:'女声'},
  {value:'zh-CN-XiaoruiNeural',label:'晓睿（女声）',group:'女声'},
  {value:'zh-CN-XiaoshuangNeural',label:'晓双（女声）',group:'女声'},
  {value:'zh-CN-XiaoxuanNeural',label:'晓萱（女声）',group:'女声'},
  {value:'zh-CN-XiaoyanNeural',label:'晓颜（女声）',group:'女声'},
  {value:'zh-CN-XiaozhenNeural',label:'晓甄（女声）',group:'女声'},
  {value:'zh-CN-YunxiNeural',label:'云希（男声）',group:'男声'},
  {value:'zh-CN-YunjianNeural',label:'云健（男声·新闻）',group:'男声'},
  {value:'zh-CN-YunfengNeural',label:'云枫（男声）',group:'男声'},
  {value:'zh-CN-YunhaoNeural',label:'云皓（男声）',group:'男声'},
  {value:'zh-CN-YunyeNeural',label:'云野（男声）',group:'男声'},
  {value:'zh-CN-YunzeNeural',label:'云泽（男声）',group:'男声'},
  {value:'zh-CN-XiaoyouNeural',label:'晓悠（女童·可爱）',group:'搞笑/特色'},
  {value:'zh-CN-YunxiaNeural',label:'云夏（男声·少年）',group:'搞笑/特色'},
];

function initVoiceSelector() {
  const sel = document.getElementById('tts-voice');
  const groups = {};
  for (const v of TTS_VOICES) {
    if (!groups[v.group]) groups[v.group] = [];
    groups[v.group].push(v);
  }
  let html = '';
  for (const g of Object.keys(groups)) {
    html += `<optgroup label="${escapeHtml(g)}">`;
    for (const v of groups[g]) {
      html += `<option value="${escapeHtml(v.value)}">${escapeHtml(v.label)}</option>`;
    }
    html += '</optgroup>';
  }
  sel.innerHTML = html;
  sel.value = 'zh-CN-XiaoxiaoNeural';
}

async function loadScript() {
  try {
    const res = await apiFetch(`/eval/results/${resultId}`);
    if (!res.ok) throw new Error('加载段子失败');
    const data = await res.json();
    document.getElementById('script-preview').textContent = data.content || '（无内容）';
  } catch (err) {
    document.getElementById('script-preview').textContent = '加载失败：' + err.message;
  }
}

function goBack() {
  window.location.href = '/static/eval.html?_=' + Date.now();
}
function goEval() {
  window.location.href = '/static/eval.html?_=' + Date.now();
}

function getConfig() {
  return {
    result_id: resultId,
    style: document.getElementById('style-select').value,
    tts_enabled: document.getElementById('tts-enabled').checked,
    tts_voice: document.getElementById('tts-voice').value,
    bgm_enabled: false,
    pace: document.getElementById('pace-select').value,
    max_scenes: parseInt(document.getElementById('max-scenes').value, 10),
  };
}

function setError(msg) {
  const box = document.getElementById('error-box');
  box.innerHTML = msg ? `<div class="error-box">${escapeHtml(msg)}</div>` : '';
}
function setSuccess(msg) {
  const box = document.getElementById('error-box');
  box.innerHTML = msg ? `<div class="success-box">${escapeHtml(msg)}</div>` : '';
}

function setRunning(running) {
  isRunning = running;
  const btn = document.getElementById('start-btn');
  btn.disabled = running;
  btn.textContent = running ? '生成中...' : '开始第一步：剧本分镜';
}

async function startFirstStage() {
  if (isRunning || currentJob) return;
  setError('');
  setRunning(true);
  try {
    // 创建任务并自动跑第一阶段
    const createRes = await apiFetch('/video/jobs', {method:'POST', body:JSON.stringify(getConfig())});
    const jobData = await createRes.json();
    if (!createRes.ok) throw new Error(jobData.detail || '创建任务失败');
    currentJob = jobData;
    renderTimeline();
    await runStage('script');
  } catch (err) {
    setError(err.message);
    setRunning(false);
  }
}

async function runStage(stageName) {
  if (!currentJob) return;
  setRunning(true);
  setError('');
  document.getElementById('preview-body').innerHTML = `
    <div class="empty-state"><div class="spinner"></div><p>正在执行「${_stageLabel(stageName)}」...</p></div>
  `;
  try {
    const res = await apiFetch(`/video/jobs/${currentJob.job_id}/stage/${stageName}/run`, {method:'POST'});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '阶段执行失败');
    currentJob = data;
    renderTimeline();
    renderStageReview(stageName);
  } catch (err) {
    setError(err.message);
    await refreshJob();
  } finally {
    setRunning(false);
  }
}

async function editStage(stageName, payload) {
  if (!currentJob) return;
  setRunning(true);
  setError('');
  try {
    const res = await apiFetch(`/video/jobs/${currentJob.job_id}/stage/${stageName}/edit`, {
      method:'POST',
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '保存失败');
    currentJob = data;
    renderTimeline();
    setSuccess('修改已保存');
    renderStageReview(stageName);
  } catch (err) {
    setError(err.message);
  } finally {
    setRunning(false);
  }
}

async function aiModifyStage(stageName, instruction) {
  if (!currentJob) return;
  setRunning(true);
  setError('');
  try {
    const res = await apiFetch(`/video/jobs/${currentJob.job_id}/stage/${stageName}/ai-modify`, {
      method:'POST',
      body:JSON.stringify({instruction})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'AI 优化失败');
    currentJob = data;
    renderTimeline();
    setSuccess('AI 已优化，请检查后保存或继续');
    renderStageReview(stageName);
  } catch (err) {
    setError(err.message);
  } finally {
    setRunning(false);
  }
}

async function refreshJob() {
  if (!currentJob) return;
  try {
    const res = await apiFetch(`/video/jobs/${currentJob.job_id}`);
    if (res.ok) {
      currentJob = await res.json();
      renderTimeline();
    }
  } catch (err) {
    console.error('刷新任务失败', err);
  }
}

function _stageLabel(name) {
  const map = {script:'剧本分镜',assets:'画面资产',storyboard:'分镜预览',video:'视频合成',post:'后期配音'};
  return map[name] || name;
}

function renderTimeline() {
  const timeline = document.getElementById('timeline');
  if (!currentJob) {
    timeline.innerHTML = '';
    return;
  }
  const statusMap = {};
  for (const s of currentJob.stages) statusMap[s.name] = s.status;
  let html = '';
  for (const name of ['script','assets','storyboard','video','post']) {
    const status = statusMap[name] || 'pending';
    const cls = status === 'done' ? 'done' : (status === 'running' ? 'active' : (status === 'failed' ? 'failed' : ''));
    html += `<div class="timeline-item ${cls}"><div class="timeline-dot"></div><div>${_stageLabel(name)}</div></div>`;
  }
  timeline.innerHTML = html;
  document.getElementById('job-status').textContent = currentJob.status === 'done' ? '已完成' : currentJob.status === 'failed' ? '失败' : '生成中...';
}

function renderStageReview(stageName) {
  const body = document.getElementById('preview-body');
  const title = document.getElementById('preview-title');
  title.textContent = `${_stageLabel(stageName)} · 审核与修改`;

  if (stageName === 'script') {
    body.innerHTML = renderScriptReview();
  } else if (stageName === 'assets') {
    body.innerHTML = renderAssetsReview();
  } else if (stageName === 'storyboard') {
    body.innerHTML = renderStoryboardReview();
  } else if (stageName === 'video') {
    body.innerHTML = renderVideoReview();
  } else if (stageName === 'post') {
    body.innerHTML = renderPostReview();
  }
}

function renderScriptReview() {
  const scenes = (currentJob.storyboard && currentJob.storyboard.scenes) || (currentJob.script_json && currentJob.script_json.scenes) || [];
  let html = `
    <div class="ai-box">
      <label>🤖 AI 优化指令（可选）</label>
      <input type="text" id="ai-instruction" placeholder="例如：让画面提示词更搞笑、每个镜头突出一个冲突点">
      <button class="btn-orange" style="margin-top:10px;width:100%;" onclick="aiModifyScript()">AI 优化分镜</button>
    </div>
    <div class="scene-list">
  `;
  for (const s of scenes) {
    html += `
      <div class="scene-card">
        <div class="scene-card-header"><span class="scene-card-title">镜头 ${s.order + 1}</span></div>
        <div class="scene-field">
          <label>文案</label>
          <textarea id="script-text-${s.order}">${escapeHtml(s.text || '')}</textarea>
        </div>
        <div class="scene-field">
          <label>画面提示词</label>
          <textarea id="script-prompt-${s.order}">${escapeHtml(s.image_prompt || '')}</textarea>
        </div>
      </div>
    `;
  }
  html += '</div>';
  html += `
    <div class="stage-actions">
      <button class="btn-orange" onclick="saveScript()">💾 保存修改</button>
      <button class="btn-gray" onclick="runStage('assets')">下一步：生成画面 →</button>
    </div>
  `;
  return html;
}

function imageUrl(relPath) {
  if (!relPath) return '';
  if (relPath.startsWith('http://') || relPath.startsWith('https://') || relPath.startsWith('/')) return relPath;
  return `/static/video/${currentJob.job_id}/${relPath}`;
}

function renderAssetsReview() {
  const scenes = (currentJob.storyboard && currentJob.storyboard.scenes) || [];
  let html = `
    <div class="ai-box">
      <label>🤖 AI 优化指令（可选）</label>
      <input type="text" id="ai-instruction" placeholder="例如：让画面更夸张、颜色更鲜艳">
      <button class="btn-orange" style="margin-top:10px;width:100%;" onclick="aiModifyAssets()">AI 优化画面提示词</button>
    </div>
    <div class="scene-list">
  `;
  for (const s of scenes) {
    html += `
      <div class="scene-card">
        <div class="scene-card-header"><span class="scene-card-title">镜头 ${s.order + 1}</span></div>
        <img class="scene-img" src="${escapeHtml(imageUrl(s.image_path))}" alt="镜头${s.order+1}" onerror="this.style.opacity=0.3">
        <div class="scene-field">
          <label>画面提示词</label>
          <textarea id="asset-prompt-${s.order}">${escapeHtml(s.image_prompt || '')}</textarea>
        </div>
        <div class="scene-actions">
          <button class="btn-orange" onclick="regenerateImage(${s.order})">🔄 重新生成此图</button>
        </div>
      </div>
    `;
  }
  html += '</div>';
  html += `
    <div class="stage-actions">
      <button class="btn-orange" onclick="saveAssets()">💾 保存提示词</button>
      <button class="btn-gray" onclick="runStage('storyboard')">下一步：生成分镜 →</button>
    </div>
  `;
  return html;
}

function renderStoryboardReview() {
  const scenes = (currentJob.storyboard && currentJob.storyboard.scenes) || [];
  let html = '<div class="scene-list">';
  for (const s of scenes) {
    html += `
      <div class="scene-card">
        <div class="scene-card-header"><span class="scene-card-title">镜头 ${s.order + 1}</span></div>
        <img class="scene-img" src="${escapeHtml(imageUrl(s.image_path))}" alt="镜头${s.order+1}" onerror="this.style.opacity=0.3">
        <div class="scene-field">
          <label>时长（秒）</label>
          <input type="number" id="duration-${s.order}" value="${(s.duration || 3).toFixed(1)}" step="0.5" min="1">
        </div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6">${escapeHtml(s.text || '')}</div>
      </div>
    `;
  }
  html += '</div>';
  html += `
    <div class="stage-actions">
      <button class="btn-orange" onclick="saveStoryboard()">💾 保存时长</button>
      <button class="btn-gray" onclick="runStage('video')">下一步：合成无声视频 →</button>
    </div>
  `;
  return html;
}

function renderVideoReview() {
  const videoUrl = currentJob.video_url ? currentJob.video_url.replace('final.mp4','silent.mp4') : '';
  return `
    <div class="empty-state" style="padding:30px 0;">
      <div class="video-box">
        <video src="${escapeHtml(videoUrl)}" controls playsinline></video>
      </div>
      <p style="color:var(--muted);font-size:13px;">这是不含配音的默片。确认画面无误后进入后期配音。</p>
      <div class="stage-actions">
        <button class="btn-gray" onclick="runStage('post')">下一步：后期配音 →</button>
      </div>
    </div>
  `;
}

function renderPostReview() {
  return `
    <div class="empty-state" style="padding:30px 0;">
      <div class="video-box">
        <video src="${escapeHtml(currentJob.video_url || '')}" controls autoplay loop playsinline></video>
      </div>
      <div class="stage-actions">
        <a class="btn-orange" href="${escapeHtml(currentJob.video_url || '')}" download target="_blank">下载成片</a>
        <button class="btn-gray" onclick="reVoice()">🎙️ 换音色重新配音</button>
      </div>
    </div>
  `;
}

async function saveScript() {
  const scenes = [];
  const list = (currentJob.storyboard && currentJob.storyboard.scenes) || (currentJob.script_json && currentJob.script_json.scenes) || [];
  for (const s of list) {
    scenes.push({
      order: s.order,
      text: document.getElementById(`script-text-${s.order}`).value,
      image_prompt: document.getElementById(`script-prompt-${s.order}`).value,
    });
  }
  await editStage('script', {scenes});
}

async function saveAssets() {
  const scenes = [];
  const list = (currentJob.storyboard && currentJob.storyboard.scenes) || [];
  for (const s of list) {
    scenes.push({
      order: s.order,
      image_prompt: document.getElementById(`asset-prompt-${s.order}`).value,
    });
  }
  await editStage('assets', {scenes});
}

async function regenerateImage(order) {
  const scenes = [];
  const list = (currentJob.storyboard && currentJob.storyboard.scenes) || [];
  for (const s of list) {
    scenes.push({
      order: s.order,
      image_prompt: document.getElementById(`asset-prompt-${s.order}`).value,
      regenerate: s.order === order,
    });
  }
  await editStage('assets', {scenes});
}

async function saveStoryboard() {
  const durations = {};
  const list = (currentJob.storyboard && currentJob.storyboard.scenes) || [];
  for (const s of list) {
    durations[s.order] = parseFloat(document.getElementById(`duration-${s.order}`).value);
  }
  await editStage('storyboard', {durations});
}

async function aiModifyScript() {
  const instruction = document.getElementById('ai-instruction').value.trim();
  await aiModifyStage('script', instruction);
}

async function aiModifyAssets() {
  const instruction = document.getElementById('ai-instruction').value.trim();
  await aiModifyStage('assets', instruction);
}

async function reVoice() {
  const voice = document.getElementById('tts-voice').value;
  await editStage('post', {tts_voice: voice});
  await runStage('post');
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initVoiceSelector();
loadScript();
</script>
</body>
</html>
