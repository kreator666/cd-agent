<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业版｜剧本工坊</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#343434;
  --muted:#888b92;
  --light:#f5f6f8;
  --line:#eceef2;
  --line-dark:#dfe2e7;
  --orange:#ff764a;
  --green:#18a058;
  --icon:#5f6368;
  --shadow:0 18px 50px rgba(20,26,38,.10);
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:16px;letter-spacing:.02em;
}
.app{height:100vh;display:flex;flex-direction:column;background:#fff;position:relative;}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}

/* Topbar */
.topbar{height:76px;display:grid;grid-template-columns:420px 1fr 420px;align-items:center;padding:0 28px 0 26px;border-bottom:1px solid rgba(238,240,244,.45);position:relative;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.team{display:flex;align-items:center;gap:12px;color:#333;font-weight:650;border-radius:18px;padding:8px 10px;margin-left:-10px;transition:.24s ease;}
.team:hover,.action:hover{background:#f7f8fa;transform:translateY(-1px)}
.avatars{display:flex;align-items:center;width:74px;}
.avatar{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;background:linear-gradient(135deg,#111,#b7a17c);box-shadow:0 2px 7px rgba(0,0,0,.14);transition:.28s cubic-bezier(.2,.8,.2,1);}
.team:hover .avatar{margin-left:-2px;transform:translateY(-2px)}
.avatar:first-child{margin-left:0;background:linear-gradient(135deg,#f1d6a4,#1e1e1e)}
.avatar:nth-child(2){background:linear-gradient(135deg,#eee,#ba7a5a)}
.avatar:nth-child(3){background:linear-gradient(135deg,#111,#f0c26f)}
.team .count{color:#111}.chev{font-size:16px;color:#6f737a;margin-left:2px;transition:.25s}.team.open .chev{transform:rotate(180deg)}
.title{text-align:center;font-size:20px;font-weight:760;color:#232323;}
.title.editing::after{content:"正在生成…";font-size:13px;color:#ff764a;margin-left:12px;font-weight:700;animation:pulse 1.1s infinite}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:18px;color:#333;font-weight:620;}
.action{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:16px;padding:9px 10px;transition:.24s cubic-bezier(.2,.8,.2,1);}
.action svg{width:20px;height:20px;stroke:#41454b;stroke-width:2;fill:none;transition:.24s}.action:hover svg{stroke:#ff764a;transform:scale(1.05)}

/* Main layout */
.main{flex:1;display:grid;grid-template-columns:48.5% 51.5%;min-height:0;}
.left,.right{position:relative;min-width:0;height:100%;}
.left{padding:38px 42px 104px 70px;display:flex;flex-direction:column;}
.right{padding:39px 54px 110px 53px;display:flex;flex-direction:column;}

/* Left panel - chat area */
.chat-area{flex:1;overflow-y:auto;max-width:745px;}
.chat-msg{margin-bottom:20px;animation:appear .4s cubic-bezier(.2,.8,.2,1);}
.chat-msg .msg-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.chat-msg .msg-avatar{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.14);}
.chat-msg .msg-name{font-size:14px;font-weight:750;color:#474747;}
.chat-msg .msg-role{font-size:12px;color:#9aa0a6;font-weight:600;}
.chat-msg .msg-body{line-height:1.9;font-size:16px;font-weight:600;color:#3f3f3f;padding-left:38px;}
.chat-msg .msg-body p{margin:8px 0;}
.chat-msg.user .msg-body{color:#232323;}
.chat-msg.system .msg-avatar{background:linear-gradient(135deg,#f1d6a4,#1e1e1e);}
.chat-msg.skill .msg-avatar{background:linear-gradient(135deg,#eee,#ba7a5a);}

/* Outline card in chat */
.outline-card{background:#f8f9fb;border-radius:14px;padding:16px 18px;margin-bottom:16px;border:1px solid var(--line);}
.outline-card h4{margin:0 0 10px;font-size:15px;font-weight:780;color:#232323;}
.outline-card textarea{width:100%;min-height:80px;padding:10px;border-radius:10px;border:1px solid var(--line-dark);font-family:inherit;font-size:15px;resize:vertical;outline:none;}
.outline-card textarea:focus{border-color:#ff764a;}
.outline-card .meta-row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;}
.outline-card .meta-row label{font-size:13px;color:#666;font-weight:600;}
.outline-card .meta-row select{padding:5px 10px;border-radius:8px;border:1px solid var(--line-dark);font-size:13px;outline:none;}
.outline-card .meta-row select:focus{border-color:#ff764a;}

/* Progress panel */
.progress{margin-top:24px;max-width:780px;transition:.38s cubic-bezier(.2,.8,.2,1)}
.progress-head{display:flex;align-items:center;justify-content:space-between;color:#5f646c;margin-bottom:18px;}
.progress-title{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:780;}
.progress-title svg{width:26px;height:26px;stroke:#7b8087;fill:none;stroke-width:2.2;}
.step-count{font-size:16px;color:#8b8e95;font-weight:680;margin-left:20px;}
.expand{font-size:15px;color:#6c7076;display:flex;align-items:center;gap:8px;border-radius:12px;padding:7px 10px;transition:.2s}.expand:hover{background:#f4f5f7;color:#222}.expand span{display:inline-block;transition:.25s}.progress.collapsed .expand span{transform:rotate(-90deg)}
.tasks{display:flex;flex-direction:column;gap:18px;margin-left:4px;max-height:210px;overflow:hidden;transition:max-height .38s cubic-bezier(.2,.8,.2,1),opacity .28s}.progress.collapsed .tasks{max-height:0;opacity:0}
.task{display:grid;grid-template-columns:34px 1fr 86px;align-items:center;gap:14px;color:#3a3d41;border-radius:16px;padding:3px 8px 3px 0;transition:.24s cubic-bezier(.2,.8,.2,1);}
.task:hover{background:#fafafa;transform:translateX(6px)}
.status{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.8px solid #e3e6ea;background:#fff;transition:.26s;}
.status.done{background:#15171a;border-color:#15171a;color:#fff;}
.status.active{border-color:#7e8288;position:relative;animation:ring 1.5s infinite;}
.status.active::after{content:"";width:6px;height:6px;border-radius:50%;background:#45494f;}
.status svg{width:13px;height:13px;stroke:currentColor;stroke-width:3;fill:none;}
.task-title{font-size:16px;font-weight:750;}.task.muted .task-title{color:#c6c8cd;}.state{font-size:13px;color:#b5b8be;text-align:right;font-weight:650;}

/* Mention button */
.mention{position:absolute;left:69px;bottom:91px;color:var(--orange);font-size:20px;font-weight:800;transition:.22s;}.mention:hover{transform:scale(1.03);filter:drop-shadow(0 6px 14px rgba(255,118,74,.18))}

/* Prompt bar */
.prompt{position:absolute;left:42px;right:28px;bottom:20px;min-height:72px;display:flex;align-items:center;border-top:1px solid #f0f1f4;background:rgba(255,255,255,.96);transition:.25s;}
.prompt.focus{border-top-color:#ffd4c5;box-shadow:0 -12px 26px rgba(255,118,74,.07)}
.prompt .placeholder{position:absolute;left:0;top:-33px;color:#c8cacf;font-size:17px;font-weight:620;transition:.2s}.prompt.focus .placeholder{color:#ff764a;transform:translateY(-2px)}
.prompt-input{min-width:270px;max-width:590px;outline:0;color:#333;font-weight:650;font-size:16px;margin-left:18px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prompt-input:empty::before{content:""}
.prompt-icons-left,.prompt-icons-right{display:flex;align-items:center;gap:22px;color:#62666d;}
.prompt-icons-left svg,.prompt-icons-right svg{width:22px;height:22px;stroke:#62666d;fill:none;stroke-width:2;transition:.22s}.icon-btn:hover svg{stroke:#ff764a;transform:translateY(-2px)}
.pill{display:flex;align-items:center;gap:8px;color:#3c3f45;font-weight:680;border-radius:14px;padding:7px 9px;transition:.22s}.pill:hover{background:#f5f6f8}.pill .doc{width:20px;height:20px;}.lobster{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ff8a38;color:#fff;font-size:12px;line-height:1;transition:.25s}.lobster:hover{transform:rotate(18deg) scale(1.12)}
.grow{flex:1}.send{display:none;color:#ff764a;font-weight:850;font-size:15px;}.prompt.has-text .send{display:block}.prompt.has-text .prompt-icons-right .hide-on-text{display:none}

/* Right panel */
.history{align-self:center;margin-left:6px;margin-bottom:36px;display:flex;align-items:center;gap:12px;color:#2f3338;font-size:18px;font-weight:780;border-radius:18px;padding:9px 14px;transition:.24s;}
.history:hover{background:#f7f8fa;transform:translateY(-2px)}.history svg{width:22px;height:22px;stroke:#4a4f56;fill:none;stroke-width:2;}
.window-tools{position:absolute;top:24px;right:42px;display:flex;align-items:center;gap:18px;color:#8a8e95;z-index:8;}
.window-tools button{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;transition:.18s}.window-tools button:hover{background:#f4f5f7;transform:translateY(-2px)}.window-tools svg{width:20px;height:20px;stroke:#878c94;fill:none;stroke-width:2;}
.editor{max-width:690px;margin-top:8px;color:#4a4a4a;font-size:20px;line-height:2.0;font-weight:650;position:relative;transition:.35s ease;}
.editor p{margin:0 0 20px;transition:.22s ease;}.editor p:hover{color:#222;transform:translateX(4px)}.editor .name{font-size:22px;font-weight:820;color:#474747;margin-bottom:24px;}.pause{font-weight:850;color:#3b3b3b;}
.generated{animation:appear .52s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,rgba(255,118,74,.08),rgba(255,255,255,0));border-radius:14px;padding-left:12px!important;margin-left:-12px!important;}
.typing::after{content:"▋";color:#ff764a;animation:blink .85s steps(1) infinite;margin-left:2px}.face{position:absolute;right:-6px;bottom:112px;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#fff4f0,#222);border:3px solid #fff;box-shadow:0 5px 20px rgba(0,0,0,.16);transition:.25s}.face:hover{transform:translateX(-8px) scale(1.06)}
.soft-line{position:absolute;top:0;bottom:0;left:0;width:1px;background:linear-gradient(to bottom,rgba(238,240,244,0),rgba(238,240,244,.22),rgba(238,240,244,0));}

/* Dropdowns, panels, modals */
.dropdown,.panel,.modal,.toast{position:absolute;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);box-shadow:var(--shadow);border:1px solid rgba(230,232,238,.86);border-radius:22px;opacity:0;pointer-events:none;transform:translateY(10px) scale(.98);transition:.25s cubic-bezier(.2,.8,.2,1)}
.dropdown.open,.panel.open,.modal.open,.toast.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.team-menu{top:66px;left:24px;width:290px;padding:14px}.menu-item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;font-weight:700;color:#444;cursor:pointer;}.menu-item:hover{background:#f7f8fa}.mini-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f0c26f,#222)}.menu-sub{font-size:13px;color:#9aa0a6;font-weight:600;margin-top:2px}
.panel{top:86px;right:30px;width:360px;max-height:70vh;padding:18px;overflow:auto}.panel h3{margin:4px 0 16px;font-size:17px}.history-item,.file-item{padding:13px;border-radius:16px;margin-bottom:8px;background:#fafafa;line-height:1.6;cursor:pointer;}.history-item:hover,.file-item:hover{background:#fff2ed}.file-type{font-size:12px;color:#ff764a;font-weight:800}.drawer-close{float:right;color:#888;font-size:20px;border-radius:8px;padding:2px 8px;}.drawer-close:hover{background:#f4f5f7;}.modal{position:fixed;left:50%;top:50%;width:420px;padding:24px;transform:translate(-50%,-46%) scale(.98)}.modal.open{transform:translate(-50%,-50%) scale(1)}.modal h3{margin:0 0 14px}.share-box{background:#f7f8fa;border-radius:14px;padding:14px;color:#777;margin:14px 0;word-break:break-all}.copy-btn{background:#15171a;color:#fff;border-radius:14px;padding:11px 16px;font-weight:800}.mask{position:fixed;inset:0;background:rgba(20,24,32,.08);z-index:35;opacity:0;pointer-events:none;transition:.22s}.mask.open{opacity:1;pointer-events:auto}.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);border-radius:999px;padding:12px 18px;font-weight:800;color:#333}.toast.show{transform:translate(-50%,0)}

/* Skill selector chips in team menu */
.skill-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-left:42px;}
.skill-chip{display:inline-block;padding:4px 10px;background:#f0f1f4;border-radius:10px;font-size:12px;font-weight:650;color:#555;cursor:pointer;transition:.15s;}
.skill-chip:hover{background:#ffe8e0;color:#ff764a;}
.skill-chip.active{background:#ff764a;color:#fff;}

/* Persona badge */
.persona-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:#f0f1f4;border-radius:10px;font-size:13px;font-weight:700;color:#333;margin-left:auto;}
.persona-badge .dot{width:8px;height:8px;border-radius:50%;background:#18a058;}

/* Animations */
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,118,74,.18);animation:ripple .55s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(12);opacity:0}}@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(126,130,136,.16)}50%{box-shadow:0 0 0 8px rgba(126,130,136,0)}}@keyframes appear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}

/* Responsive */
@media(max-width:1100px){body{overflow:auto;height:auto}.app{height:auto;min-height:100vh}.topbar{grid-template-columns:1fr;gap:16px;height:auto;padding:24px}.title{text-align:left}.actions{justify-content:flex-start;flex-wrap:wrap}.main{grid-template-columns:1fr}.left,.right{padding:30px}.prompt{position:sticky;bottom:0;left:0;right:0}.mention,.face,.window-tools{display:none}.history{align-self:flex-start;margin-bottom:24px}.editor,.article{max-width:none}.editor{font-size:18px}.panel{right:12px;width:calc(100vw - 24px)}.modal{width:calc(100vw - 36px)}}

/* Empty state in editor */
.editor-empty{color:#999;text-align:center;padding:60px 20px;font-size:16px;font-weight:600;}

/* Budget warning in prompt */
.budget-hint{position:absolute;right:0;top:-28px;font-size:12px;color:#ff764a;font-weight:650;display:none;}
.budget-hint.show{display:block;}

/* Model select in topbar area (small) */
.model-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#f5f6f8;border-radius:10px;font-size:12px;font-weight:650;color:#555;cursor:pointer;}
.model-pill:hover{background:#ffe8e0;color:#ff764a;}

/* Nav sidebar for pro page (compact) */
.nav-sidebar{position:absolute;left:0;top:76px;bottom:0;width:56px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:8px;z-index:15;}
.nav-sidebar a{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#6f737a;text-decoration:none;font-size:18px;transition:.2s;}
.nav-sidebar a:hover{background:#f0f1f4;}
.nav-sidebar a.active{background:#fff2ed;color:#ff764a;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="team" id="teamBtn">
      <div class="avatars" aria-hidden="true"><span class="avatar"></span><span class="avatar"></span><span class="avatar"></span></div>
      <span>写作团队</span><span class="count" id="teamCount">（加载中）</span><span class="chev">⌄</span>
    </button>
    <div class="title" id="pageTitle">新对话</div>
    <div class="actions">
      <button class="action" data-action="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><path d="M18 4l2 2-2 2"/></svg><span>新建对话</span></button>
      <button class="action" data-action="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg><span>对话历史</span></button>
      <button class="action" data-action="share"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>分享</span></button>
      <button class="action" data-action="files"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>查看文件</span></button>
    </div>
  </header>

  <!-- Compact nav sidebar -->
  <nav class="nav-sidebar">
    <a href="/static/index.html" title="首页">🏠</a>
    <a href="/static/speed.html" title="极速版">⚡</a>
    <a href="/static/pro.html" class="active" title="专业版">🎬</a>
    <a href="/static/skills.html" title="Skill市场">🧩</a>
    <a href="/static/me.html" title="我的">👤</a>
  </nav>

  <main class="main">
    <section class="left">
      <div class="chat-area" id="chatArea">
        <!-- Outline input card -->
        <div class="outline-card">
          <h4>📝 选题 / 大纲 / 创意</h4>
          <textarea id="outline" placeholder="输入创意大纲，例如：实习生被领导刁难后逆袭..."></textarea>
          <div class="meta-row">
            <label>模型：</label>
            <select id="model-select"><option value="">使用默认配置</option></select>
            <div class="persona-badge" id="personaBadge" style="display:none;"><span class="dot"></span><span id="personaName">未选择画像</span></div>
          </div>
        </div>
      </div>

      <!-- Progress panel -->
      <div class="progress" id="progressBox">
        <div class="progress-head">
          <div class="progress-title"><svg viewBox="0 0 24 24"><path d="M16 4a4 4 0 0 1 0 8h-1"/><path d="M8 20a4 4 0 0 1 0-8h1"/><path d="M8 4h1a4 4 0 0 1 0 8H8a4 4 0 0 0 0 8h1"/></svg><span>写作进程</span><span class="step-count" id="stepCount">0/0</span></div>
          <button class="expand" id="expandBtn">展开<span>⌄</span></button>
        </div>
        <div class="tasks" id="tasks"></div>
      </div>

      <button class="mention" id="mentionBtn">@Get达人</button>

      <div class="prompt" id="promptBar">
        <div class="placeholder" id="promptPlaceholder">描述你的创作需求，比如：写一篇关于AI发展的深度文章</div>
        <div class="prompt-icons-left">
          <button class="icon-btn" title="添加附件"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="icon-btn" title="语音输入"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v6a3 3 0 0 0 6 0v-2a10 10 0 1 0-3.92 7.94"/></svg></button>
          <button class="pill" id="docPill" style="display:none;"><svg class="doc" viewBox="0 0 24 24"><path d="M8 4h8l4 4v12H8z"/><path d="M16 4v5h4"/></svg><span id="docName">文档</span></button>
        </div>
        <div id="promptInput" class="prompt-input" contenteditable="true" spellcheck="false"></div>
        <div class="grow"></div>
        <div class="prompt-icons-right">
          <button class="icon-btn hide-on-text" title="格式"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
          <button class="icon-btn hide-on-text" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></button>
          <button class="icon-btn hide-on-text" title="更多"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
          <button class="lobster" id="lobsterBtn" title="喜剧龙虾">●</button>
          <button style="font-size:20px;color:#777">⌄</button>
          <button class="send" id="sendBtn">发送</button>
        </div>
        <div class="budget-hint" id="budgetHint">⚠️ 预计消耗较高</div>
      </div>
    </section>

    <section class="right" id="rightPanel">
      <span class="soft-line"></span>
      <div class="window-tools">
        <button title="复制" data-tool="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="1"/><path d="M5 16V5h11"/></svg></button>
        <button title="保存" data-tool="save"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></button>
        <button title="下载" data-tool="download"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 21h14"/></svg></button>
        <button title="关闭" data-tool="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button class="history" data-action="history"><svg viewBox="0 0 24 24"><path d="M7 7a7 7 0 1 1-1.4 8"/><path d="M7 3v4h4"/><path d="M12 8v5l3 2"/></svg>查看历史记录</button>
      <article class="editor" id="editor">
        <div class="editor-empty">选择人物画像和 Skill 后，在左侧描述需求并发送，生成的剧本将显示在这里。</div>
      </article>
      <div class="face"></div>
    </section>
  </main>

  <!-- Team dropdown -->
  <div class="dropdown team-menu" id="teamMenu">
    <div style="padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;">
      <div class="menu-item" id="menuUser"><span class="mini-avatar" style="background:linear-gradient(135deg,#f1d6a4,#1e1e1e)"></span><div><span id="userName">意辰</span><div class="menu-sub">创作主理人</div></div><span class="persona-badge" id="menuPersonaBadge" style="display:none;margin-left:auto;"><span class="dot"></span><span id="menuPersonaName">未选择</span></span></div>
      <div class="menu-item" onclick="mentionSkill('Get达人')"><span class="mini-avatar" style="background:linear-gradient(135deg,#ddd,#9b7)"></span><div>Get达人<div class="menu-sub">资料与结构助手 · 点击@他</div></div></div>
    </div>
    <div style="padding:4px;">
      <div style="font-size:12px;color:#888;font-weight:700;padding:4px 8px;">写作团队成员（Skill）</div>
      <div id="teamSkills"></div>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px;">
      <div class="menu-item" onclick="openPersonaModal()"><span class="mini-avatar" style="background:linear-gradient(135deg,#eee,#ccc);display:grid;place-items:center;font-size:16px;">+</span><div>新建人物画像</div></div>
      <div class="menu-item" onclick="openModelModal()" style="display:none;" id="menuModelItem"><span class="mini-avatar" style="background:linear-gradient(135deg,#dbeafe,#3b82f6);display:grid;place-items:center;font-size:12px;">AI</span><div>切换模型</div></div>
    </div>
  </div>

  <!-- Mask -->
  <div class="mask" id="mask"></div>

  <!-- History panel -->
  <aside class="panel" id="historyPanel">
    <button class="drawer-close" data-close>×</button>
    <h3>对话历史</h3>
    <div id="historyList"><div style="color:#999;font-size:14px;padding:10px;">暂无历史记录</div></div>
  </aside>

  <!-- Files panel (placeholder) -->
  <aside class="panel" id="filesPanel">
    <button class="drawer-close" data-close>×</button>
    <h3>查看文件</h3>
    <div style="color:#999;font-size:14px;padding:10px;">文件功能即将上线</div>
  </aside>

  <!-- Share modal (placeholder) -->
  <div class="modal" id="shareModal">
    <h3>分享这个写作空间</h3>
    <p>分享功能即将上线，您可以先复制链接。</p>
    <div class="share-box" id="shareBox">https://prototype.local/share</div>
    <button class="copy-btn" id="copyShare">复制链接</button>
  </div>

  <!-- Create persona modal -->
  <div class="modal-overlay" id="persona-modal">
    <div class="modal-box">
      <h3>新建人物画像</h3>
      <input type="text" id="p-name" placeholder="画像名称，如：毒舌职场侠">
      <label style="font-size:.8125rem;color:#666;"><input type="checkbox" id="p-short"> 偏好短句（每句不超过15字）</label>
      <input type="text" id="p-forbidden" placeholder="禁用词，用逗号分隔">
      <select id="p-pace">
        <option value="fast">快节奏</option>
        <option value="medium" selected>中节奏</option>
        <option value="slow">慢节奏</option>
      </select>
      <label style="font-size:.8125rem;color:#666;"><input type="checkbox" id="p-hook"> 开头必须有钩子</label>
      <textarea id="p-example" placeholder="风格示例（可选）" style="height:60px;"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePersonaModal()">取消</button>
        <button class="btn-save" onclick="createPersona()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script src="/static/common.js"></script>
<script>

/* ========== State ========== */
let personas = [];
let allSkills = [];
let selectedSkills = new Set();
let selectedPersonaId = '';
let currentConversationId = null;
let conversations = [];
let isGenerating = false;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ========== Helpers ========== */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => t.classList.remove('show'), 1600);
}

function ripple(e) {
  const el = e.currentTarget;
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size / 2) + 'px';
  r.style.top = (e.clientY - rect.top - size / 2) + 'px';
  el.style.position = 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function closeAll() {
  $('#mask').classList.remove('open');
  $('#historyPanel').classList.remove('open');
  $('#filesPanel').classList.remove('open');
  $('#shareModal').classList.remove('open');
  $('#teamMenu').classList.remove('open');
  $('#teamBtn').classList.remove('open');
}

function saveConversations() {
  localStorage.setItem('pro_conversations', JSON.stringify(conversations));
}

function loadConversations() {
  try {
    conversations = JSON.parse(localStorage.getItem('pro_conversations') || '[]');
  } catch { conversations = []; }
}

function getSkillTypeLabel(type) {
  const map = { topic: '话题专家', attitude: '态度导师', emotion: '情绪设计师', genre: '风格顾问' };
  return map[type] || type;
}

function getSkillGradient(type) {
  const map = {
    topic: 'linear-gradient(135deg,#dbeafe,#3b82f6)',
    attitude: 'linear-gradient(135deg,#dcfce7,#22c55e)',
    emotion: 'linear-gradient(135deg,#fce7f3,#ec4899)',
    genre: 'linear-gradient(135deg,#fef3c7,#f59e0b)',
  };
  return map[type] || 'linear-gradient(135deg,#eee,#ba7a5a)';
}

/* ========== UI Builders ========== */
function addChatMessage(role, name, roleLabel, content, options = {}) {
  const area = $('#chatArea');
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  if (options.animate !== false) div.style.animation = 'appear .4s cubic-bezier(.2,.8,.2,1)';

  const avatarStyle = role === 'user'
    ? 'background:linear-gradient(135deg,#f1d6a4,#1e1e1e)'
    : (options.gradient || 'background:linear-gradient(135deg,#eee,#ba7a5a)');

  div.innerHTML = `
    <div class="msg-header">
      <span class="msg-avatar" style="${avatarStyle}"></span>
      <span class="msg-name">${escapeHtml(name)}</span>
      <span class="msg-role">${escapeHtml(roleLabel)}</span>
    </div>
    <div class="msg-body">${content}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function setProgress(steps) {
  const container = $('#tasks');
  const total = steps.length;
  let done = 0;
  let activeIdx = -1;
  steps.forEach((s, i) => { if (s.state === 'done') done++; if (s.state === 'active') activeIdx = i; });
  $('#stepCount').textContent = `${Math.max(done, activeIdx + 1)}/${total}`;

  container.innerHTML = steps.map((s, i) => {
    let statusClass = 'status';
    let statusInner = '';
    if (s.state === 'done') { statusClass += ' done'; statusInner = '<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>'; }
    else if (s.state === 'active') { statusClass += ' active'; }
    const muted = s.state === 'pending' && activeIdx > -1 && i > activeIdx ? ' muted' : '';
    return `<div class="task${muted}"><span class="${statusClass}">${statusInner}</span><span class="task-title">${escapeHtml(s.title)}</span><span class="state">${s.label}</span></div>`;
  }).join('');
}

/* ========== Data Loading ========== */
async function loadModels() {
  try {
    const res = await apiFetch('/models');
    const data = await res.json();
    const sel = $('#model-select');
    const opts = data.models || [];
    sel.innerHTML = '<option value="">使用默认配置</option>' +
      opts.map(m => `<option value="${m}">${m}</option>`).join('');
  } catch (err) {
    console.error('加载模型列表失败', err);
  }
}

async function loadPersonas() {
  try {
    const res = await apiFetch('/pro/personas');
    personas = await res.json();
    updatePersonaUI();
  } catch (err) {
    console.error('加载画像失败', err);
  }
}

function updatePersonaUI() {
  const sel = $('#persona-select');
  if (sel) {
    if (personas.length === 0) {
      sel.innerHTML = '<option value="">暂无画像，请先创建</option>';
    } else {
      sel.innerHTML = personas.map(p => `<option value="${p.persona_id}">${escapeHtml(p.name)}</option>`).join('');
    }
  }
  // Update badge
  const p = personas.find(x => x.persona_id === selectedPersonaId);
  const badge = $('#personaBadge');
  const nameEl = $('#personaName');
  const menuBadge = $('#menuPersonaBadge');
  const menuName = $('#menuPersonaName');
  if (p) {
    badge.style.display = 'inline-flex';
    nameEl.textContent = p.name;
    menuBadge.style.display = 'inline-flex';
    menuName.textContent = p.name;
  } else if (personas.length > 0) {
    selectedPersonaId = personas[0].persona_id;
    badge.style.display = 'inline-flex';
    nameEl.textContent = personas[0].name;
    menuBadge.style.display = 'inline-flex';
    menuName.textContent = personas[0].name;
  } else {
    badge.style.display = 'none';
    menuBadge.style.display = 'none';
  }
}

async function loadSkills() {
  try {
    const res = await apiFetch('/pro/skills');
    allSkills = await res.json();
    renderTeamSkills();
    updateEstimate();
  } catch (err) {
    console.error('加载 Skill 失败', err);
  }
}

function renderTeamSkills() {
  const container = $('#teamSkills');
  if (!container) return;
  const types = ['topic', 'attitude', 'emotion', 'genre'];
  let html = '';
  types.forEach(t => {
    const list = allSkills.filter(s => s.skill_type === t);
    if (list.length) {
      html += `<div style="padding:4px 8px;"><div style="font-size:11px;color:#aaa;font-weight:700;margin-bottom:4px;text-transform:uppercase;">${getSkillTypeLabel(t)}</div>`;
      html += `<div class="skill-chips">`;
      list.forEach(s => {
        const active = selectedSkills.has(s.name) ? ' active' : '';
        html += `<span class="skill-chip${active}" data-skill="${escapeHtml(s.name)}" onclick="toggleSkillChip(this)">${escapeHtml(s.name)}</span>`;
      });
      html += `</div></div>`;
    }
  });
  container.innerHTML = html || '<div style="padding:8px;color:#999;font-size:13px;">暂无可用 Skill</div>';

  // Update team count
  const totalMembers = 1 + 1 + allSkills.length; // user + get达人 + skills
  $('#teamCount').textContent = `（${totalMembers}）`;
}

function toggleSkillChip(el) {
  const name = el.dataset.skill;
  if (selectedSkills.has(name)) {
    selectedSkills.delete(name);
    el.classList.remove('active');
  } else {
    selectedSkills.add(name);
    el.classList.add('active');
  }
  updateEstimate();
}

function updateEstimate() {
  const outline = $('#outline').value;
  const base = Math.round(outline.length * 0.8);
  const skillCost = { topic: 15, attitude: 10, emotion: 10, genre: 15, rule_persona: 20, script_composer: 25 };
  let skillTokens = 0;
  selectedSkills.forEach(s => {
    const info = allSkills.find(x => x.name === s);
    if (info) skillTokens += skillCost[info.skill_type] || 10;
  });
  const total = base + skillTokens;
  const hint = $('#budgetHint');
  hint.textContent = `预计消耗约 ${total} tokens`;
  hint.classList.toggle('show', total > 800);
}

/* ========== Conversation Management ========== */
function newConversation() {
  currentConversationId = Date.now().toString();
  const title = $('#outline').value.trim().slice(0, 20) || '新对话';
  $('#pageTitle').textContent = title;
  $('#pageTitle').classList.add('editing');

  // Clear chat except outline card
  const area = $('#chatArea');
  const outlineCard = area.querySelector('.outline-card');
  area.innerHTML = '';
  if (outlineCard) area.appendChild(outlineCard);

  // Clear editor
  $('#editor').innerHTML = '<div class="editor-empty">选择人物画像和 Skill 后，在左侧描述需求并发送，生成的剧本将显示在这里。</div>';

  setTimeout(() => {
    $('#pageTitle').classList.remove('editing');
    toast('新建对话完成');
  }, 600);
}

function saveCurrentConversation() {
  if (!currentConversationId) return;
  const title = $('#pageTitle').textContent;
  const editorHtml = $('#editor').innerHTML;
  const existing = conversations.find(c => c.id === currentConversationId);
  const conv = {
    id: currentConversationId,
    title,
    updatedAt: Date.now(),
    editorHtml,
    outline: $('#outline').value,
    personaId: selectedPersonaId,
    skillIds: Array.from(selectedSkills),
  };
  if (existing) {
    Object.assign(existing, conv);
  } else {
    conversations.unshift(conv);
  }
  saveConversations();
}

function renderHistory() {
  const list = $('#historyList');
  if (!conversations.length) {
    list.innerHTML = '<div style="color:#999;font-size:14px;padding:10px;">暂无历史记录</div>';
    return;
  }
  list.innerHTML = conversations.map(c => {
    const date = new Date(c.updatedAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `<div class="history-item" data-id="${c.id}"><b>${escapeHtml(c.title)}</b><br><span style="font-size:12px;color:#888;">${date} · ${c.skillIds?.length || 0} 个 Skill</span></div>`;
  }).join('');
  list.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => loadConversation(item.dataset.id));
  });
}

function loadConversation(id) {
  const c = conversations.find(x => x.id === id);
  if (!c) return;
  currentConversationId = c.id;
  $('#pageTitle').textContent = c.title;
  $('#outline').value = c.outline || '';
  selectedPersonaId = c.personaId || '';
  selectedSkills = new Set(c.skillIds || []);
  if (c.editorHtml) {
    $('#editor').innerHTML = c.editorHtml;
  } else {
    $('#editor').innerHTML = '<div class="editor-empty">选择人物画像和 Skill 后，在左侧描述需求并发送，生成的剧本将显示在这里。</div>';
  }
  updatePersonaUI();
  renderTeamSkills();
  updateEstimate();
  closeAll();
  toast('已加载历史对话');
}

/* ========== Generation ========== */
async function sendPrompt() {
  const input = $('#promptInput');
  const text = input.textContent.trim();
  if (!text) { input.focus(); return; }

  const outline = $('#outline').value.trim();
  if (!outline) {
    toast('请先填写选题大纲');
    $('#outline').focus();
    return;
  }
  if (!selectedPersonaId) {
    toast('请先选择人物画像');
    return;
  }

  // Add user message
  addChatMessage('user', '我', '创作主理人', `<p>${escapeHtml(text)}</p>`);
  input.textContent = '';
  $('#promptBar').classList.remove('has-text');

  // Determine if mentioning a skill
  let mentionedSkill = null;
  const mentionMatch = text.match(/^@(\S+)\s*/);
  if (mentionMatch) {
    mentionedSkill = mentionMatch[1];
  }

  // Show skill response in left panel
  const skillInfo = mentionedSkill
    ? (allSkills.find(s => s.name === mentionedSkill) || { name: mentionedSkill, skill_type: 'topic' })
    : { name: 'Get达人', skill_type: 'system' };

  const skillLabel = skillInfo.name === 'Get达人' ? '资料与结构助手' : getSkillTypeLabel(skillInfo.skill_type);
  const skillGradient = skillInfo.name === 'Get达人'
    ? 'background:linear-gradient(135deg,#ddd,#9b7)'
    : getSkillGradient(skillInfo.skill_type);

  addChatMessage('skill', skillInfo.name, skillLabel, '<p>收到，正在处理您的需求…</p>', { gradient: skillGradient });

  // Update title if new
  if ($('#pageTitle').textContent === '新对话') {
    $('#pageTitle').textContent = outline.slice(0, 20) || '剧本创作';
  }

  // Show progress
  setProgress([
    { title: '解析创作需求', state: 'done', label: '已完成' },
    { title: '调用人物画像规则', state: 'active', label: '进行中' },
    { title: '组合 Skill 能力', state: 'pending', label: '待处理' },
    { title: '生成剧本内容', state: 'pending', label: '待处理' },
  ]);

  // Generate
  isGenerating = true;
  $('#pageTitle').classList.add('editing');

  try {
    const model = $('#model-select').value || undefined;
    const skillIds = Array.from(selectedSkills);
    const res = await apiFetch('/pro/generate', {
      method: 'POST',
      body: JSON.stringify({ outline, persona_id: selectedPersonaId, skill_ids: skillIds, confirm_budget: true, model })
    });
    const data = await res.json();

    // Typewriter effect on right panel
    const script = data.script || '';
    typewriteScript(script);

    // Update progress done
    setProgress([
      { title: '解析创作需求', state: 'done', label: '已完成' },
      { title: '调用人物画像规则', state: 'done', label: '已完成' },
      { title: '组合 Skill 能力', state: 'done', label: '已完成' },
      { title: '生成剧本内容', state: 'done', label: '已完成' },
    ]);

    // Update skill response
    const msgs = $('#chatArea').querySelectorAll('.chat-msg.skill');
    const lastSkill = msgs[msgs.length - 1];
    if (lastSkill) {
      lastSkill.querySelector('.msg-body').innerHTML = `<p>已生成剧本内容，请查看右侧面板。${mentionedSkill ? `【${escapeHtml(mentionedSkill)}】已参与创作。` : ''}</p>`;
    }

    saveCurrentConversation();
    toast('剧本生成完成');
  } catch (err) {
    toast('生成失败：' + err.message);
    const msgs = $('#chatArea').querySelectorAll('.chat-msg.skill');
    const lastSkill = msgs[msgs.length - 1];
    if (lastSkill) {
      lastSkill.querySelector('.msg-body').innerHTML = `<p style="color:#e94560;">生成失败：${escapeHtml(err.message)}</p>`;
    }
  } finally {
    isGenerating = false;
    $('#pageTitle').classList.remove('editing');
  }
}

function typewriteScript(text) {
  const editor = $('#editor');
  editor.innerHTML = '';
  const paragraphs = text.split('\n').filter(p => p.trim());
  if (paragraphs.length === 0) {
    editor.innerHTML = '<div class="editor-empty">生成内容为空</div>';
    return;
  }

  let pIdx = 0;
  let charIdx = 0;
  let currentP = null;

  function nextParagraph() {
    if (pIdx >= paragraphs.length) return;
    currentP = document.createElement('p');
    currentP.className = 'generated typing';
    editor.appendChild(currentP);
    charIdx = 0;
    typeChar();
  }

  function typeChar() {
    if (!currentP) return;
    const line = paragraphs[pIdx];
    currentP.textContent = line.slice(0, charIdx + 1);
    charIdx++;
    if (charIdx < line.length) {
      setTimeout(typeChar, 12);
    } else {
      currentP.classList.remove('typing');
      pIdx++;
      if (pIdx < paragraphs.length) {
        setTimeout(nextParagraph, 80);
      } else {
        $('#pageTitle').classList.remove('editing');
      }
    }
  }

  nextParagraph();
}

/* ========== Persona Modal ========== */
function openPersonaModal() {
  $('#persona-modal').classList.add('active');
  closeAll();
}
function closePersonaModal() { $('#persona-modal').classList.remove('active'); }

async function createPersona() {
  const name = $('#p-name').value.trim();
  if (!name) { toast('请输入画像名称'); return; }
  const rule_content = {
    prefer_short_sentence: $('#p-short').checked,
    forbidden_words: $('#p-forbidden').value.split(',').map(s => s.trim()).filter(Boolean),
    sentence_pace: $('#p-pace').value,
    opening_hook: $('#p-hook').checked,
    example_style: $('#p-example').value.trim(),
  };
  try {
    await apiFetch('/pro/personas', {
      method: 'POST',
      body: JSON.stringify({ name, rule_content })
    });
    closePersonaModal();
    loadPersonas();
    toast('画像创建成功');
  } catch (err) {
    toast('创建失败：' + err.message);
  }
}

/* ========== @ Skill ========== */
function mentionSkill(name) {
  const input = $('#promptInput');
  input.focus();
  input.textContent = '@' + name + ' ';
  $('#promptBar').classList.add('has-text');
  placeCaretAtEnd(input);
  closeAll();
}

/* ========== Event Listeners ========== */
document.addEventListener('DOMContentLoaded', () => {
  requireAuth();
  loadConversations();

  // Ripple
  $$('button,.action,.task').forEach(b => b.addEventListener('click', ripple));

  // Mask close
  $('#mask').addEventListener('click', closeAll);
  $$('[data-close]').forEach(b => b.addEventListener('click', closeAll));

  // Team dropdown
  $('#teamBtn').addEventListener('click', e => {
    e.stopPropagation();
    $('#teamMenu').classList.toggle('open');
    $('#teamBtn').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#teamMenu') && !e.target.closest('#teamBtn')) {
      $('#teamMenu').classList.remove('open');
      $('#teamBtn').classList.remove('open');
    }
  });

  // Topbar actions
  $$('[data-action]').forEach(btn => btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    if (a === 'history') { closeAll(); $('#mask').classList.add('open'); renderHistory(); $('#historyPanel').classList.add('open'); }
    if (a === 'files') { closeAll(); $('#mask').classList.add('open'); $('#filesPanel').classList.add('open'); }
    if (a === 'share') { closeAll(); $('#mask').classList.add('open'); $('#shareModal').classList.add('open'); }
    if (a === 'new') { newConversation(); }
  }));

  // Expand/collapse progress
  $('#expandBtn').addEventListener('click', () => {
    $('#progressBox').classList.toggle('collapsed');
    $('#expandBtn').firstChild.textContent = $('#progressBox').classList.contains('collapsed') ? '收起' : '展开';
  });

  // Prompt input
  const input = $('#promptInput');
  const prompt = $('#promptBar');
  input.addEventListener('focus', () => prompt.classList.add('focus'));
  input.addEventListener('blur', () => prompt.classList.remove('focus'));
  input.addEventListener('input', () => {
    prompt.classList.toggle('has-text', input.textContent.trim().length > 0);
    updateEstimate();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendPrompt(); } });
  $('#sendBtn').addEventListener('click', sendPrompt);
  $('#mentionBtn').addEventListener('click', () => mentionSkill('Get达人'));
  $('#lobsterBtn').addEventListener('click', () => toast('喜剧龙虾已待命 🦞'));

  // Window tools
  $$('.window-tools button').forEach(b => b.addEventListener('click', () => {
    const tool = b.dataset.tool;
    if (tool === 'copy') {
      const text = $('#editor').innerText;
      if (!text || text.includes('选择人物画像')) return;
      navigator.clipboard && navigator.clipboard.writeText(text);
      toast('正文已复制');
    }
    if (tool === 'save') { saveCurrentConversation(); toast('已保存到对话历史'); }
    if (tool === 'download') { toast('下载功能即将上线'); }
    if (tool === 'close') {
      $('#rightPanel').animate([{ opacity: 1, transform: 'translateX(0)' }, { opacity: .35, transform: 'translateX(24px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  }));

  // Share copy
  $('#copyShare').addEventListener('click', () => toast('分享链接已复制'));

  // Outline input
  $('#outline').addEventListener('input', updateEstimate);

  // Model select change
  $('#model-select').addEventListener('change', function() {
    toast('已切换模型：' + (this.value || '默认'));
  });

  // Load data
  loadModels();
  loadPersonas();
  loadSkills();

  // Init first conversation
  if (!currentConversationId) {
    currentConversationId = Date.now().toString();
  }

  // Set user name from localStorage if available
  const userId = getCurrentUserId();
  if (userId) {
    $('#userName').textContent = userId.slice(0, 6) || '意辰';
  }
});
</script>
</body>
</html>
