<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频创作｜30 秒段子一键成片</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#343434;
  --muted:#888b92;
  --light:#f5f6f8;
  --line:#eceef2;
  --line-dark:#dfe2e7;
  --orange:#ff764a;
  --green:#18a058;
  --red:#ff4a4a;
  --yellow:#f5af19;
  --icon:#5f6368;
  --shadow:0 18px 50px rgba(20,26,38,.10);
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:15px;letter-spacing:.02em;
}
.app{height:100vh;display:flex;flex-direction:column;background:#fff;position:relative;}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}

/* Topbar */
.topbar{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px 0 26px;border-bottom:1px solid rgba(238,240,244,.45);position:relative;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.title{text-align:center;font-size:20px;font-weight:760;color:#232323;}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:18px;color:#333;font-weight:620;}
.action{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:16px;padding:9px 10px;transition:.24s cubic-bezier(.2,.8,.2,1);text-decoration:none;color:inherit;}
.action:hover{background:#f7f8fa;transform:translateY(-1px)}

/* Nav sidebar */
.nav-sidebar{position:absolute;left:0;top:76px;bottom:0;width:56px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:8px;z-index:15;}
.nav-sidebar a{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#6f737a;text-decoration:none;font-size:18px;transition:.2s;}
.nav-sidebar a:hover{background:#f0f1f4;}
.nav-sidebar a.active{background:#fff2ed;color:#ff764a;}

/* Main layout */
.main{flex:1;min-height:0;padding-left:56px;overflow:hidden;display:flex;}
.create-container{display:flex;width:100%;height:100%;}

/* Left config panel */
.config-panel{width:360px;min-width:320px;max-width:420px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden;}
.config-header{padding:20px 22px 14px;border-bottom:1px solid var(--line);}
.config-header h2{margin:0;font-size:18px;font-weight:780;color:#232323;}
.config-header p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.config-body{flex:1;overflow-y:auto;padding:20px 22px;}
.config-section{margin-bottom:22px;}
.config-section h3{margin:0 0 12px;font-size:14px;font-weight:760;color:#232323;display:flex;align-items:center;gap:8px;}
.config-section h3 .badge{font-size:11px;font-weight:650;color:var(--orange);background:#fff2ed;padding:2px 8px;border-radius:10px;}

.model-select{width:100%;padding:10px 12px;border:1px solid var(--line-dark);border-radius:10px;font-size:14px;background:#fff;outline:none;}
.model-select:focus{border-color:var(--orange);}
.template-direction{margin-top:10px;padding:12px 14px;background:#fff7f4;border:1px solid #ffd4c5;border-radius:10px;font-size:13px;color:#555;line-height:1.6;}

.dim-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
.dim-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.dim-row:last-child{margin-bottom:0;}
.dim-row label{font-size:13px;font-weight:650;color:#555;}
.dim-row input{width:100%;padding:9px 12px;border:1px solid var(--line-dark);border-radius:9px;font-size:14px;outline:none;}
.dim-row input:focus{border-color:var(--orange);}

.start-btn{width:100%;padding:13px 16px;background:var(--orange);color:#fff;border-radius:12px;font-size:15px;font-weight:780;transition:.2s;margin-top:4px;}
.start-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.start-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

.hint-box{margin-top:14px;padding:12px 14px;background:#fff;border:1px dashed var(--line-dark);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.7;}

/* Right result panel */
.result-panel{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;background:#fff;}
.result-header{padding:20px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.result-header h2{margin:0;font-size:18px;font-weight:780;color:#232323;}
.stats{display:flex;gap:16px;}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;background:#f5f6f8;padding:6px 12px;border-radius:20px;}
.stat b{color:#232323;font-weight:700;}
.stat b.over{color:var(--red);}

.result-body{flex:1;overflow-y:auto;padding:24px 28px;}

/* Section panels (仿 polish.html) */
.section-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.section-panel-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.section-textarea{width:100%;padding:12px 14px;border:1px solid var(--line-dark);border-radius:12px;font-size:14px;line-height:1.8;color:#444;font-family:inherit;resize:vertical;outline:none;}
.section-textarea:focus{border-color:var(--orange);}

.editor-actions{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.editor-actions .start-btn{width:auto;padding:12px 24px;margin-top:0;}
.editor-actions .regen-btn{padding:12px 20px;background:#fff;border:1px solid var(--line-dark);color:#333;border-radius:12px;font-size:14px;font-weight:700;transition:.2s;}
.editor-actions .regen-btn:hover{background:#f5f6f8;}
.editor-actions .regen-btn:disabled{opacity:.6;cursor:not-allowed;}
.char-tip{font-size:13px;color:var(--muted);}
.char-tip b{color:#232323;}
.char-tip b.over{color:var(--red);}

/* Loading */
.loading-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.loading-card-title{font-size:15px;font-weight:780;color:#232323;margin-bottom:10px;}
.progress-bar{width:100%;height:4px;background:#f0f0f0;border-radius:2px;margin:12px 0 6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--orange);width:0%;transition:width .3s;}
.loading-tip{font-size:12px;color:var(--muted);}

/* History section */
.history-section{border-top:1px solid var(--line);background:#fafbfc;padding:14px 28px;max-height:220px;overflow-y:auto;}
.history-header{font-size:14px;font-weight:760;color:#232323;margin-bottom:10px;}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;}
.history-item-main{min-width:0;}
.history-title{font-size:14px;font-weight:700;color:#232323;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.history-item-actions{display:flex;gap:8px;flex-shrink:0;}
.history-open-btn{padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;background:#fff2ed;color:var(--orange);transition:.2s;}
.history-open-btn:hover{filter:brightness(.97);}
.history-open-btn:disabled{opacity:.55;cursor:not-allowed;}
.history-empty{font-size:13px;color:var(--muted);padding:8px 0;}

.empty-state{text-align:center;padding:80px 20px;color:#999;}
.empty-state h3{margin:0 0 10px;font-size:18px;color:#555;}

@media(max-width:900px){
  .config-panel{width:280px;min-width:260px;}
}
@media(max-width:768px){
  .create-container{flex-direction:column;}
  .config-panel{width:100%;height:auto;max-height:50%;border-right:none;border-bottom:1px solid var(--line);}
  .main{padding-left:0;}
  .nav-sidebar{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div></div>
    <div class="title">短视频创作｜30 秒段子一键成片</div>
    <div class="actions">
      <a class="action" href="/static/video-list.html"><span>📹 我的视频</span></a>

    </div>
  </header>

  <nav class="nav-sidebar">

  </nav>

  <main class="main">
    <div class="create-container">
      <!-- Left: config -->
      <aside class="config-panel">
        <div class="config-header">
          <h2>短视频创作</h2>
          <p>输入四维度，由 standup_short Skill 生成约 30 秒短段子，可分段编辑后一键生成视频</p>
        </div>
        <div class="config-body">
          <div class="config-section">
            <h3>模型 <span class="badge">单模型</span></h3>
            <select id="model-select" class="model-select">
              <option value="deepseek-v4-flash">deepseek-v4-flash</option>
            </select>
          </div>

          <div class="config-section">
            <h3>主题模板</h3>
            <select id="dim-template" class="model-select">
              <option value="">选择主题模板（自动填充四维度）</option>
            </select>
            <p id="template-direction" class="template-direction" style="display:none;"></p>
          </div>

          <div class="config-section">
            <h3>四维度输入</h3>
            <div class="dim-card">
              <div class="dim-row">
                <label>话题 topic</label>
                <input type="text" id="input-topic" placeholder="例如：骨折" value="骨折">
              </div>
              <div class="dim-row">
                <label>态度 attitude</label>
                <input type="text" id="input-attitude" placeholder="例如：自嘲" value="自嘲">
              </div>
              <div class="dim-row">
                <label>偏见 bias</label>
                <input type="text" id="input-bias" placeholder="例如：长辈总觉得年轻人脆弱" value="长辈总觉得年轻人脆弱">
              </div>
              <div class="dim-row">
                <label>情绪 emotion</label>
                <input type="text" id="input-emotion" placeholder="例如：荒诞" value="荒诞">
              </div>
            </div>
          </div>

          <button id="start-btn" class="start-btn">✍️ 生成段子</button>
          <div class="hint-box">💡 建议全文不超过 180 字（约 30 秒口播）。生成后可在右侧分段微调，再点击「🎬 生成视频」。</div>
        </div>
      </aside>

      <!-- Right: editor + history -->
      <section class="result-panel">
        <div class="result-header">
          <h2>段子编辑</h2>
          <div class="stats">
            <div class="stat">总字数 <b id="stat-chars">0</b></div>
            <div class="stat">上限 <b>180</b></div>
          </div>
        </div>
        <div class="result-body" id="result-body">
          <div class="empty-state">
            <h3>👈 在左侧输入四维度生成</h3>
            <p>生成约 30 秒的短段子，系统将按【】标签自动分段，可逐段编辑。</p>
          </div>
        </div>
        <div class="history-section">
          <div class="history-header">📜 我的历史（短视频段子）</div>
          <div class="history-list" id="history-list">
            <div class="history-empty">加载中...</div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/static/common.js"></script>

function initTemplateSelector() {
  const mainTemplates = DIM_TEMPLATES.filter(t => t.group === "main");
  const advancedTemplates = DIM_TEMPLATES.filter(t => t.group === "advanced");
  let html = '<option value="">选择主题模板（自动填充四维度）</option>';
  html += mainTemplates.map((t, idx) => `<option value="${idx}">${t.title}</option>`).join('');
  html += '<optgroup label="进阶备用">';
  html += advancedTemplates.map((t, idx) => `<option value="${mainTemplates.length + idx}">${t.title}</option>`).join('');
  html += '</optgroup>';
  dimTemplateSelect.innerHTML = html;

  dimTemplateSelect.addEventListener('change', () => {
    const idx = parseInt(dimTemplateSelect.value, 10);
    if (Number.isNaN(idx) || idx < 0 || idx >= DIM_TEMPLATES.length) {
      templateDirectionEl.style.display = 'none';
      templateDirectionEl.textContent = '';
      return;
    }
    const t = DIM_TEMPLATES[idx];
    document.getElementById('input-topic').value = t.topic;
    document.getElementById('input-attitude').value = t.attitude;
    document.getElementById('input-bias').value = t.bias;
    document.getElementById('input-emotion').value = t.emotion;
    templateDirectionEl.textContent = `创作方向：${t.direction}`;
    templateDirectionEl.style.display = 'block';
  });
}

async function loadModels() {
  try {
    const res = await apiFetch('/models');
    const data = await res.json();
    const models = data.models || [];
    const fallback = data.recommended || data.default || (models[0] || 'deepseek-v4-flash');
    modelSelect.innerHTML = models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
    if (!models.includes('deepseek-v4-flash')) {
      modelSelect.innerHTML = '<option value="deepseek-v4-flash">deepseek-v4-flash</option>' + modelSelect.innerHTML;
    }
    const defaultModel = models.includes('kimi-k2.6') ? 'kimi-k2.6' : fallback;
    if (modelSelect.querySelector(`option[value="${defaultModel}"]`)) {
      modelSelect.value = defaultModel;
    }
  } catch (err) {
    console.error('加载模型失败', err);
  }
}

/* ---------- 段落解析（与后端 comedy_agent/services/script_sections.py parse_sections 逻辑一致） ---------- */

const LABEL_RE = /^\s*【(.+?)】\s*$/;

function stripBlankLines(lines) {
  let start = 0;
  let end = lines.length;
  while (start < end && !lines[start].trim()) start++;
  while (end > start && !lines[end - 1].trim()) end--;
  return lines.slice(start, end);
}

function parseSections(content) {
  if (!content || !content.trim()) return [];
  const lines = content.split(/\r?\n/);
  const labelIdx = [];
  lines.forEach((line, i) => {
    if (LABEL_RE.test(line)) labelIdx.push(i);
  });

  if (labelIdx.length) {
    const result = [];
    const preamble = stripBlankLines(lines.slice(0, labelIdx[0]));
    if (preamble.length) {
      result.push({ index: result.length, title: '标题', text: preamble.join('\n'), has_label: false });
    }
    labelIdx.forEach((lineIdx, pos) => {
      const end = pos + 1 < labelIdx.length ? labelIdx[pos + 1] : lines.length;
      const title = lines[lineIdx].match(LABEL_RE)[1].trim();
      const body = stripBlankLines(lines.slice(lineIdx + 1, end));
      result.push({ index: result.length, title, text: body.join('\n'), has_label: true });
    });
    return result;
  }

  // 兜底：按空行切分
  return content.trim().split(/\n\s*\n/)
    .filter(c => c.trim())
    .map((chunk, i) => ({ index: i, title: `第${i + 1}段`, text: chunk.replace(/^\n+|\n+$/g, ''), has_label: false }));
}

function getSectionText(index) {
  const ta = document.getElementById(`text-${index}`);
  return ta ? ta.value : (sections[index] ? sections[index].text : '');
}

function buildMergedContent() {
  return sections.map((s) => {
    const text = getSectionText(s.index);
    return s.has_label ? `【${s.title}】\n${text}` : text;
  }).join('\n\n');
}

function countChars() {
  return buildMergedContent().replace(/\s/g, '').length;
}

function updateCharCount() {
  const n = countChars();
  statChars.textContent = n;
  statChars.classList.toggle('over', n > CHAR_LIMIT);
  const inline = document.getElementById('char-inline');
  if (inline) {
    inline.textContent = n;
    inline.classList.toggle('over', n > CHAR_LIMIT);
  }
}

/* ---------- 生成流程 ---------- */

function setGenerating(generating) {
  startBtn.disabled = generating;
  startBtn.textContent = generating ? '生成中...' : '✍️ 生成段子';
}

function renderLoadingCard() {
  resultBody.innerHTML = `
    <div class="loading-card">
      <div class="loading-card-title">短段子生成中...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="loading-tip">模型正在创作约 30 秒的短段子，通常需要几十秒，请稍候。</div>
    </div>
  `;
}

async function startGeneration() {
  const topic = document.getElementById('input-topic').value.trim();
  const attitude = document.getElementById('input-attitude').value.trim();
  const bias = document.getElementById('input-bias').value.trim();
  const emotion = document.getElementById('input-emotion').value.trim();
  if (!topic || !attitude || !emotion) {
    alert('请填写话题、态度和情绪');
    return;
  }

  setGenerating(true);
  currentResultId = null;
  sections = [];
  renderLoadingCard();

  try {
    const res = await apiFetch('/eval/sessions', {
      method: 'POST',
      body: JSON.stringify({
        skill_name: 'standup_short',
        model: modelSelect.value,
        topic,
        attitude,
        bias: bias || '无',
        emotion,
        duration: 0.5,
      }),
    });
    const data = await res.json();
    currentSessionId = data.session_id;
    startPolling();
  } catch (err) {
    alert('创建生成任务失败：' + err.message);
    setGenerating(false);
    renderEmpty();
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!currentSessionId) return;
    try {
      const res = await apiFetch(`/eval/sessions/${currentSessionId}`);
      const data = await res.json();
      const completed = (data.results || []).filter(r => r.status === 'done' || r.status === 'failed').length;
      const fill = document.getElementById('progress-fill');
      if (fill) fill.style.width = (data.total ? (completed / data.total * 100) : 0) + '%';
      if (data.status === 'done' || data.status === 'failed' || completed === data.total) {
        clearInterval(pollTimer);
        pollTimer = null;
        setGenerating(false);
        renderSessionResult(data);
        loadHistory();
      }
    } catch (err) {
      console.error('轮询失败', err);
    }
  }, 2000);
}

function renderEmpty() {
  resultBody.innerHTML = `
    <div class="empty-state">
      <h3>👈 在左侧输入四维度生成</h3>
      <p>生成约 30 秒的短段子，系统将按【】标签自动分段，可逐段编辑。</p>
    </div>
  `;
  statChars.textContent = '0';
  statChars.classList.remove('over');
}

function renderSessionResult(data) {
  const doneResult = (data.results || []).find(r => r.status === 'done' && r.content);
  const failedResult = (data.results || []).find(r => r.status === 'failed');

  if (!doneResult) {
    resultBody.innerHTML = `
      <div class="empty-state">
        <h3>生成失败</h3>
        <p>${escapeHtml((failedResult && failedResult.content) || '段子生成失败，请调整四维度后重试。')}</p>
      </div>
    `;
    return;
  }
  renderEditor(doneResult.id, doneResult.content);
}

function renderEditor(resultId, content) {
  currentResultId = resultId;
  sections = parseSections(content);

  if (!sections.length) {
    resultBody.innerHTML = `
      <div class="empty-state">
        <h3>未解析到段落</h3>
        <p>生成内容为空，请重新生成一版。</p>
      </div>
    `;
    return;
  }

  const panelsHtml = sections.map((s) => {
    const lineCount = s.text ? s.text.split('\n').length : 0;
    const rows = Math.max(3, lineCount);
    return `
      <div class="section-panel" data-index="${s.index}">
        <div class="section-panel-label">${escapeHtml(s.title)}</div>
        <textarea class="section-textarea" id="text-${s.index}" rows="${rows}" data-index="${s.index}">${escapeHtml(s.text)}</textarea>
      </div>
    `;
  }).join('');

  resultBody.innerHTML = `
    <div class="editor-actions">
      <button class="start-btn" id="video-btn" onclick="createVideo()">🎬 生成视频</button>
      <button class="regen-btn" id="regen-btn" onclick="startGeneration()">🔄 重新生成一版</button>
      <span class="char-tip">总字数 <b id="char-inline">0</b> / ${CHAR_LIMIT}（超过 ${CHAR_LIMIT} 字标红）</span>
    </div>
    ${panelsHtml}
  `;
  updateCharCount();
}

resultBody.addEventListener('input', (e) => {
  if (e.target.classList.contains('section-textarea')) {
    updateCharCount();
  }
});

/* ---------- 生成视频 ---------- */

async function createVideo() {
  if (!currentResultId) {
    alert('请先生成段子');
    return;
  }
  const videoBtn = document.getElementById('video-btn');
  const original = videoBtn ? videoBtn.textContent : '';
  if (videoBtn) {
    videoBtn.disabled = true;
    videoBtn.textContent = '创建视频任务中...';
  }

  try {
    const merged = buildMergedContent();
    await apiFetch(`/eval/results/${currentResultId}/content`, {
      method: 'PUT',
      body: JSON.stringify({ content: merged }),
    });
    const res = await apiFetch('/video/jobs', {
      method: 'POST',
      body: JSON.stringify({
        result_id: currentResultId,
        style: 'illustration',
        tts_enabled: true,
        tts_voice: DEFAULT_TTS_VOICE,
        bgm_enabled: true,
        pace: 'normal',
        max_scenes: 3,
      }),
    });
    const job = await res.json();
    window.location.href = '/static/video-workbench.html?job_id=' + encodeURIComponent(job.job_id);
  } catch (err) {
    alert('创建视频任务失败：' + err.message);
    if (videoBtn) {
      videoBtn.disabled = false;
      videoBtn.textContent = original;
    }
  }
}

/* ---------- 我的历史 ---------- */

async function loadHistory() {
  try {
    const res = await apiFetch('/eval/sessions?limit=50');
    const data = await res.json();
    // 服务端不支持按 skill_name 过滤，这里前端过滤
    const items = (data.sessions || []).filter(s => s.skill_name === 'standup_short');
    renderHistory(items);
  } catch (err) {
    historyList.innerHTML = `<div class="history-empty">加载历史失败：${escapeHtml(err.message)}</div>`;
  }
}

function renderHistory(items) {
  if (!items.length) {
    historyList.innerHTML = '<div class="history-empty">暂无短视频段子历史，先在左侧生成一版吧。</div>';
    return;
  }
  historyList.innerHTML = items.map(s => `
    <div class="history-item">
      <div class="history-item-main">
        <div class="history-title">${escapeHtml(s.topic)} · ${escapeHtml(s.model)}</div>
        <div class="history-meta">${new Date(s.created_at).toLocaleString()} · ${s.total} 个结果 · ${escapeHtml(s.status)}</div>
      </div>
      <div class="history-item-actions">
        <button class="history-open-btn" onclick="loadHistorySession('${s.session_id}')">再生成视频</button>
      </div>
    </div>
  `).join('');
}

async function loadHistorySession(sessionId) {
  try {
    const res = await apiFetch(`/eval/sessions/${sessionId}`);
    const data = await res.json();
    // 回填输入
    if (data.inputs) {
      document.getElementById('input-topic').value = data.inputs.topic || '';
      document.getElementById('input-attitude').value = data.inputs.attitude || '';
      document.getElementById('input-bias').value = data.inputs.bias || '';
      document.getElementById('input-emotion').value = data.inputs.emotion || '';
    }
    if (data.model && modelSelect.querySelector(`option[value="${data.model}"]`)) {
      modelSelect.value = data.model;
    }
    currentSessionId = sessionId;
    const doneResult = (data.results || []).find(r => r.status === 'done' && r.content);
    if (doneResult) {
      renderEditor(doneResult.id, doneResult.content);
      resultBody.scrollTop = 0;
    } else {
      alert('该会话还没有生成完成的段子');
    }
  } catch (err) {
    alert('加载会话失败：' + err.message);
  }
}

startBtn.addEventListener('click', startGeneration);

async function init() {
  initTemplateSelector();
  await loadModels();
  await loadHistory();
}

init();
</script>
