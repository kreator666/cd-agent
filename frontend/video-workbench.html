<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脱口秀视频工作台</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#343434;
  --muted:#888b92;
  --light:#f5f6f8;
  --line:#eceef2;
  --line-dark:#dfe2e7;
  --orange:#ff764a;
  --green:#18a058;
  --red:#ff4a4a;
  --shadow:0 18px 50px rgba(20,26,38,.10);
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:15px;letter-spacing:.02em;
}
.app{height:100vh;display:flex;flex-direction:column;background:#fff;position:relative;}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}

/* Topbar */
.topbar{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px 0 26px;border-bottom:1px solid rgba(238,240,244,.45);position:relative;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.title{text-align:center;font-size:20px;font-weight:760;color:#232323;}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:18px;color:#333;font-weight:620;}
.action{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:16px;padding:9px 10px;transition:.24s cubic-bezier(.2,.8,.2,1);}
.action:hover{background:#f7f8fa;transform:translateY(-1px)}
.back-btn{justify-self:start;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:650;}
.back-btn:hover{color:var(--orange);}

/* Nav sidebar */
.nav-sidebar{position:absolute;left:0;top:76px;bottom:0;width:56px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:8px;z-index:15;}
.nav-sidebar a{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#6f737a;text-decoration:none;font-size:18px;transition:.2s;}
.nav-sidebar a:hover{background:#f0f1f4;}
.nav-sidebar a.active{background:#fff2ed;color:#ff764a;}

/* Main layout */
.main{flex:1;min-height:0;padding-left:56px;overflow:hidden;display:flex;}
.workbench{display:flex;width:100%;height:100%;}

/* Left config panel */
.config-panel{width:360px;min-width:320px;max-width:420px;background:#fafbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden;}
.config-header{padding:20px 22px 14px;border-bottom:1px solid var(--line);}
.config-header h2{margin:0;font-size:18px;font-weight:780;color:#232323;}
.config-header p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.config-body{flex:1;overflow-y:auto;padding:20px 22px;}
.config-section{margin-bottom:22px;}
.config-section h3{margin:0 0 12px;font-size:14px;font-weight:760;color:#232323;display:flex;align-items:center;gap:8px;}

.script-preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;color:#444;max-height:160px;overflow-y:auto;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:13px;font-weight:650;color:#555;margin-bottom:6px;}
.form-row select,.form-row input[type=range],.form-row input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line-dark);border-radius:10px;font-size:14px;background:#fff;outline:none;}
.form-row select:focus{border-color:var(--orange);}

.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle-wrap input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);}

.generate-btn{width:100%;padding:14px 16px;background:var(--orange);color:#fff;border-radius:12px;font-size:15px;font-weight:780;transition:.2s;margin-top:8px;}
.generate-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.generate-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* Right preview area */
.preview-panel{flex:1;background:#fff;display:flex;flex-direction:column;height:100%;overflow:hidden;}
.preview-header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.preview-header h3{margin:0;font-size:16px;font-weight:760;color:#232323;}
.preview-body{flex:1;overflow-y:auto;padding:24px;}

/* Stage timeline */
.stage-list{display:flex;gap:12px;margin-bottom:28px;}
.stage-item{flex:1;text-align:center;padding:14px 8px;background:#fafbfc;border:1px solid var(--line);border-radius:12px;position:relative;}
.stage-item.active{background:#fff7f4;border-color:#ffd4c5;}
.stage-item.done{background:#e6fffb;border-color:#b7eb8f;}
.stage-item.failed{background:#fff1f0;border-color:#ffa39e;}
.stage-icon{font-size:20px;margin-bottom:6px;}
.stage-name{font-size:12px;font-weight:650;color:#555;}
.stage-status{font-size:11px;color:var(--muted);margin-top:4px;}

/* Storyboard */
.storyboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
.scene-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;}
.scene-card:hover{border-color:#ffd4c5;}
.scene-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f5f6f8;}
.scene-info{padding:12px;}
.scene-text{font-size:13px;line-height:1.6;color:#444;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.scene-meta{font-size:11px;color:var(--muted);margin-top:6px;}

/* Video player */
.video-box{background:#000;border-radius:16px;overflow:hidden;max-width:420px;margin:0 auto;box-shadow:var(--shadow);}
.video-box video{width:100%;display:block;}
.video-actions{display:flex;gap:12px;justify-content:center;margin-top:18px;}
.video-actions a,.video-actions button{padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;}
.video-actions .btn-primary{background:var(--orange);color:#fff;}
.video-actions .btn-secondary{background:#fafbfc;color:#333;border:1px solid var(--line-dark);}

/* Empty / loading */
.empty-state{text-align:center;color:var(--muted);padding:60px 20px;}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.error-box{background:#fff1f0;border:1px solid #ffa39e;border-radius:12px;padding:16px;color:#cf1322;margin-top:16px;}

@media(max-width:900px){
  .workbench{flex-direction:column;}
  .config-panel{width:100%;max-width:none;height:auto;border-right:0;border-bottom:1px solid var(--line);}
  .preview-panel{height:auto;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-btn" onclick="goBack()">← 返回评测</a>
    <div class="title">🎬 脱口秀视频工作台</div>
    <div class="actions">
      <button class="action" onclick="logout()">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#41454b" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>退出</span>
      </button>
    </div>
  </header>

  <nav class="nav-sidebar">
    <a href="/static/index.html" title="首页">🏠</a>
    <a href="/static/speed.html" title="极速版">⚡</a>
    <a href="/static/pro-b.html" title="专业版" style="display:none;">🎬</a>
    <a href="/static/eval.html" title="笑果评测">🎯</a>
    <a href="/static/eval-square.html" title="段子广场">🏛️</a>
    <a href="/static/me.html" title="我的">👤</a>
  </nav>

  <main class="main">
    <div class="workbench">
      <aside class="config-panel">
        <div class="config-header">
          <h2>视频配置</h2>
          <p>基于下方段子生成一段短视频</p>
        </div>
        <div class="config-body">
          <div class="config-section">
            <h3>📝 段子原文</h3>
            <div class="script-preview" id="script-preview">加载中...</div>
          </div>

          <div class="config-section">
            <h3>🎨 视觉风格</h3>
            <div class="form-row">
              <label>风格预设</label>
              <select id="style-select">
                <option value="illustration">插画治愈风</option>
                <option value="comic">漫画吐槽风</option>
                <option value="minimal">极简文字风</option>
              </select>
            </div>
          </div>

          <div class="config-section">
            <h3>🔊 配音</h3>
            <div class="form-row">
              <div class="toggle-wrap">
                <input type="checkbox" id="tts-enabled" checked>
                <label for="tts-enabled" style="margin:0;">启用 AI 配音</label>
              </div>
            </div>
            <div class="form-row">
              <label>音色</label>
              <select id="tts-voice">
                <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
                <option value="zh-CN-YunxiNeural">云希（男声）</option>
                <option value="zh-CN-YunjianNeural">云健（男声）</option>
                <option value="zh-CN-XiaoyiNeural">晓伊（女声）</option>
              </select>
            </div>
          </div>

          <div class="config-section">
            <h3>⏱️ 节奏</h3>
            <div class="form-row">
              <label>语速/节奏</label>
              <select id="pace-select">
                <option value="normal">标准</option>
                <option value="slow">舒缓</option>
                <option value="fast">紧凑</option>
              </select>
            </div>
            <div class="form-row">
              <label>最大镜头数</label>
              <select id="max-scenes">
                <option value="3">3 个</option>
                <option value="5" selected>5 个</option>
                <option value="7">7 个</option>
              </select>
            </div>
          </div>

          <button class="generate-btn" id="generate-btn" onclick="startGeneration()">开始生成</button>
          <div id="error-box"></div>
        </div>
      </aside>

      <section class="preview-panel">
        <div class="preview-header">
          <h3>生成进度与预览</h3>
          <span id="job-status" style="font-size:13px;color:var(--muted);"></span>
        </div>
        <div class="preview-body" id="preview-body">
          <div class="empty-state">
            <div class="big">🎬</div>
            <p>点击左侧「开始生成」，后台将自动完成分镜、插画、配音与视频合成</p>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/static/common.js"></script>
<script>
requireAuth();

const params = new URLSearchParams(window.location.search);
const resultId = params.get('result_id');
let currentJobId = null;
let pollTimer = null;

if (!resultId) {
  alert('缺少 result_id');
  goEval();
}

async function loadScript() {
  try {
    const res = await apiFetch(`/eval/results/${resultId}`);
    if (!res.ok) throw new Error('加载段子失败');
    const data = await res.json();
    document.getElementById('script-preview').textContent = data.content || '（无内容）';
  } catch (err) {
    document.getElementById('script-preview').textContent = '加载失败：' + err.message;
  }
}

function goBack() {
  window.location.href = '/static/eval.html?_=' + Date.now();
}
function goEval() {
  window.location.href = '/static/eval.html?_=' + Date.now();
}

function getConfig() {
  return {
    result_id: resultId,
    style: document.getElementById('style-select').value,
    tts_enabled: document.getElementById('tts-enabled').checked,
    tts_voice: document.getElementById('tts-voice').value,
    bgm_enabled: false,
    pace: document.getElementById('pace-select').value,
    max_scenes: parseInt(document.getElementById('max-scenes').value, 10),
  };
}

async function startGeneration() {
  const btn = document.getElementById('generate-btn');
  const errBox = document.getElementById('error-box');
  errBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = '创建任务中...';

  try {
    const res = await apiFetch('/video/jobs', {
      method: 'POST',
      body: JSON.stringify(getConfig()),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '创建任务失败');
    currentJobId = data.job_id;
    startPolling();
  } catch (err) {
    errBox.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = '开始生成';
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollJob, 2000);
  pollJob();
}

async function pollJob() {
  if (!currentJobId) return;
  try {
    const res = await apiFetch(`/video/jobs/${currentJobId}`);
    const data = await res.json();
    renderJob(data);
    if (data.status === 'done' || data.status === 'failed') {
      clearInterval(pollTimer);
      document.getElementById('generate-btn').disabled = false;
      document.getElementById('generate-btn').textContent = '重新生成';
    }
  } catch (err) {
    console.error('轮询失败', err);
  }
}

function renderJob(data) {
  const body = document.getElementById('preview-body');
  const statusEl = document.getElementById('job-status');
  statusEl.textContent = data.status === 'done' ? '已完成' : data.status === 'failed' ? '失败' : '生成中...';

  let html = '<div class="stage-list">';
  const stageIcons = { script: '📝', assets: '🖼️', storyboard: '🎞️', video: '✂️', post: '🔊' };
  for (const s of data.stages) {
    const cls = s.status === 'done' ? 'done' : s.status === 'running' ? 'active' : s.status === 'failed' ? 'failed' : '';
    html += `
      <div class="stage-item ${cls}">
        <div class="stage-icon">${stageIcons[s.name] || '•'}</div>
        <div class="stage-name">${escapeHtml(s.label)}</div>
        <div class="stage-status">${escapeHtml(s.status)}</div>
      </div>
    `;
  }
  html += '</div>';

  // 分镜预览
  if (data.storyboard && data.storyboard.scenes) {
    html += '<h3 style="font-size:15px;font-weight:760;margin:0 0 14px;">分镜预览</h3>';
    html += '<div class="storyboard">';
    for (const scene of data.storyboard.scenes) {
      html += `
        <div class="scene-card">
          <img class="scene-img" src="${scene.image_path ? escapeHtml(scene.image_path) : ''}" alt="镜头${scene.order + 1}" onerror="this.style.opacity=0.3">
          <div class="scene-info">
            <div class="scene-text">${escapeHtml(scene.text)}</div>
            <div class="scene-meta">镜头 ${scene.order + 1} · ${scene.duration ? scene.duration.toFixed(1) + 's' : '等待中'}</div>
          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  // 视频预览
  if (data.status === 'done' && data.video_url) {
    html += `
      <h3 style="font-size:15px;font-weight:760;margin:0 0 14px;">成片预览</h3>
      <div class="video-box">
        <video src="${escapeHtml(data.video_url)}" controls autoplay loop playsinline></video>
      </div>
      <div class="video-actions">
        <a class="btn-primary" href="${escapeHtml(data.video_url)}" download target="_blank">下载视频</a>
        <button class="btn-secondary" onclick="goPublish('${data.video_url}')">去发布</button>
      </div>
    `;
  } else if (data.status === 'running' || data.status === 'pending') {
    html += `
      <div class="empty-state">
        <div class="spinner"></div>
        <p>正在生成中，当前阶段：${data.stage || '排队中'}</p>
      </div>
    `;
  }

  if (data.error) {
    html += `<div class="error-box"><strong>生成失败</strong><br>${escapeHtml(data.error)}</div>`;
  }

  body.innerHTML = html;
}

function goPublish(videoUrl) {
  // 将视频路径带到发布页（通过下载后手动上传）
  window.open('/static/publish.html', '_blank');
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadScript();
</script>
</body>
</html>
