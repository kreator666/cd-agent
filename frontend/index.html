<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comedy Agent — 喜剧创作助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header .status {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: #e94560;
        }
        header .status.ready { background: #16c79a; }
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .sidebar label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #666;
        }
        .sidebar input, .sidebar select, .sidebar button {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .sidebar button {
            background: #1a1a2e;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .sidebar button:hover { opacity: 0.9; }
        .sidebar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }
        .chat-area {
            flex: 1;
            background: #fff;
            border-radius: 0.75rem;
            border: 1px solid #e0e0e0;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #1a1a2e;
            color: #fff;
        }
        .message.agent {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
        }
        .message .meta {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
        }
        .input-area textarea {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            resize: none;
            height: 3.5rem;
            font-family: inherit;
        }
        .input-area button {
            padding: 0 1.5rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-state {
            text-align: center;
            color: #999;
            margin: auto;
        }
        .empty-state h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .typing {
            font-size: 0.75rem;
            color: #999;
            padding: 0 0.5rem;
        }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }
        .conversation-item {
            padding: 0.5rem 0.625rem;
            border-radius: 0.5rem;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }
        .conversation-item:hover { background: #eee; }
        .conversation-item.active { background: #1a1a2e; color: #fff; }
        .conversation-item .conv-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .conversation-item .conv-del {
            font-size: 0.75rem;
            color: #e94560;
            padding: 0 0.25rem;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .conversation-item:hover .conv-del { opacity: 1; }
        .conversation-item.active .conv-del { color: #ffb3b3; }
        .new-chat-btn {
            background: #16c79a !important;
        }
        .preference-section {
            font-size: 0.8125rem;
        }
        .preference-section summary {
            font-weight: 500;
            color: #555;
            cursor: pointer;
            user-select: none;
        }
        .preference-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.75rem;
        }
        .preference-item:last-child { border-bottom: none; }
        .preference-item .pref-key { color: #666; }
        .preference-item .pref-val { color: #333; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preference-empty { color: #999; font-size: 0.75rem; text-align: center; padding: 0.5rem; }
        .message-actions {
            margin-top: 0.375rem;
            display: flex;
            gap: 0.5rem;
        }
        .message-actions button {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            background: #e0e0e0;
            color: #333;
            width: auto;
        }
        .message-actions button:hover { background: #d0d0d0; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 360px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .modal-box h3 { margin: 0; font-size: 1rem; }
        .modal-box input, .modal-box select {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            width: 100%;
        }
        .modal-box .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        .modal-box .modal-actions button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .modal-box .modal-actions .btn-cancel { background: #e0e0e0; color: #333; }
        .modal-box .modal-actions .btn-save { background: #1a1a2e; color: #fff; }
        .script-section { font-size: 0.8125rem; }
        .script-section summary { font-weight: 500; color: #555; cursor: pointer; user-select: none; }
        .script-list { display: flex; flex-direction: column; gap: 0.375rem; }
        .script-item {
            padding: 0.5rem 0.625rem;
            border-radius: 0.5rem;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: background 0.15s;
        }
        .script-item:hover { background: #eee; }
        .script-item .script-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.25rem;
        }
        .script-item .script-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
        }
        .script-item .script-type {
            font-size: 0.7rem;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            background: #1a1a2e;
            color: #fff;
            white-space: nowrap;
        }
        .script-item .script-rating {
            font-size: 0.75rem;
            color: #f5a623;
        }
        .script-item .script-time {
            font-size: 0.7rem;
            color: #888;
        }
        .script-item .script-actions {
            display: flex;
            gap: 0.375rem;
            margin-top: 0.375rem;
        }
        .script-item .script-actions button {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            width: auto;
        }
        .script-item .script-actions .btn-view { background: #1a1a2e; color: #fff; }
        .script-item .script-actions .btn-del { background: #e94560; color: #fff; }
        .script-item .script-detail {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #fff;
            border-radius: 0.375rem;
            font-size: 0.8125rem;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }
        .script-item .script-detail.collapsed { display: none; }
        .script-item .rating-bar {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.375rem;
        }
        .script-item .rating-bar span {
            cursor: pointer;
            font-size: 1rem;
            color: #ddd;
            transition: color 0.15s;
        }
        .script-item .rating-bar span.active { color: #f5a623; }
        .script-empty { color: #999; font-size: 0.75rem; text-align: center; padding: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .container { padding: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎤 Comedy Agent</h1>
        <div style="display:flex;align-items:center;gap:1rem;">
            <a href="/static/skills.html" style="color:#fff;text-decoration:none;font-size:0.875rem;opacity:0.8;transition:opacity 0.2s;">Skill 管理</a>
            <span id="current-user" style="font-size:0.875rem;"></span>
            <button onclick="logout()" style="font-size:0.75rem;padding:0.25rem 0.75rem;background:#e94560;color:#fff;border:none;border-radius:0.375rem;cursor:pointer;">退出</button>
            <span id="status" class="status">检查中...</span>
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <label for="model">模型</label>
            <select id="model">
                <option value="">加载中...</option>
            </select>

            <label for="user-id">当前用户</label>
            <input id="user-id" type="text" readonly style="background:#f0f0f0;cursor:default;">

            <button class="new-chat-btn" onclick="startNewChat()">➕ 新对话</button>

            <label>快捷指令</label>
            <button onclick="sendQuick('写一个关于职场加班的脱口秀')">🎤 职场脱口秀</button>
            <button onclick="sendQuick('写一段相声，主题是年轻人谈恋爱')">🎭 恋爱相声</button>
            <button onclick="sendQuick('创作一个小品剧本，关于相亲')">🎬 相亲小品</button>
            <button onclick="sendQuick('分析一下这段段子的笑点结构：老板说要给我加薪，结果是加工作量')">🔍 笑点分析</button>

            <label>历史会话</label>
            <div class="conversation-list" id="conversation-list">
                <div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">加载中...</div>
            </div>

            <details class="preference-section" id="document-section">
                <summary>我的知识库</summary>
                <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem;">
                    <input type="file" id="doc-upload-input" multiple style="font-size:0.75rem;" onchange="uploadDocuments()" />
                    <div id="document-list">
                        <div class="preference-empty">暂无文档</div>
                    </div>
                </div>
            </details>

            <details class="preference-section" id="preference-section">
                <summary>我的偏好</summary>
                <div id="preference-list">
                    <div class="preference-empty">暂无记录</div>
                </div>
            </details>

            <details class="script-section" id="script-section">
                <summary>我的作品</summary>
                <div id="script-list">
                    <div class="script-empty">暂无作品</div>
                </div>
            </details>

            <details class="skill-section" id="skill-section">
                <summary>Skill 管理</summary>
                <div id="skill-list">
                    <div class="skill-empty">加载中...</div>
                </div>
                <div class="skill-actions-bar">
                    <button onclick="openInstallSkillModal()">安装 Skill</button>
                    <button onclick="reloadSkills()">热重载</button>
                </div>
            </details>
        </aside>
        <main class="main">
            <div class="chat-area" id="chat-area">
                <div class="empty-state">
                    <h2>Comedy Agent</h2>
                    <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" placeholder="输入你的需求，按 Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </main>
    </div>

    <!-- 安装 Skill Modal -->
    <div class="modal-overlay" id="install-skill-modal">
        <div class="modal-box" style="width: 480px; max-height: 90vh; overflow-y: auto;">
            <h3>安装 Skill</h3>
            <input type="text" id="install-skill-name" placeholder="Skill 名称（只允许字母、数字、下划线、连字符）" />
            <textarea id="install-skill-md" placeholder="SKILL.md 内容"></textarea>
            <textarea id="install-skill-prompt" placeholder="prompt.txt 内容"></textarea>
            <textarea id="install-skill-py" placeholder="skill.py 代码内容（可选）"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeInstallSkillModal()">取消</button>
                <button class="btn-save" onclick="confirmInstallSkill()">安装</button>
            </div>
        </div>
    </div>

    <!-- 保存作品 Modal -->
    <div class="modal-overlay" id="save-script-modal">
        <div class="modal-box">
            <h3>保存为作品</h3>
            <input type="text" id="script-title" placeholder="作品标题" />
            <select id="script-type">
                <option value="">选择类型</option>
                <option value="standup">单口喜剧</option>
                <option value="crosstalk">相声</option>
                <option value="sketch">小品</option>
                <option value="sitcom">情景喜剧</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSaveModal()">取消</button>
                <button class="btn-save" onclick="confirmSaveScript()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const chatArea = document.getElementById('chat-area');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        let history = [];
        let currentSessionId = null;

        // 登录检查
        const token = localStorage.getItem('token');
        const currentUserId = localStorage.getItem('user_id');
        if (!token || !currentUserId) {
            window.location.href = '/static/login.html';
        }
        document.getElementById('user-id').value = currentUserId || '';
        document.getElementById('current-user').textContent = currentUserId || '';

        function startNewChat() {
            currentSessionId = null;
            history = [];
            chatArea.innerHTML = `
                <div class="empty-state">
                    <h2>Comedy Agent</h2>
                    <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                </div>
            `;
            renderConversationList();
        }

        async function loadConversations() {
            const listEl = document.getElementById('conversation-list');
            try {
                const res = await fetch(`${API_BASE}/conversations?limit=20`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._conversations = data.conversations || [];
                renderConversationList();
            } catch {
                listEl.innerHTML = '<div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">加载失败</div>';
            }
        }

        function renderConversationList() {
            const listEl = document.getElementById('conversation-list');
            const conversations = window._conversations || [];
            if (conversations.length === 0) {
                listEl.innerHTML = '<div style="font-size:0.75rem;color:#999;text-align:center;padding:0.5rem;">暂无历史会话</div>';
                return;
            }
            listEl.innerHTML = '';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conversation-item' + (conv.session_id === currentSessionId ? ' active' : '');
                const title = conv.summary || '未命名会话';
                const time = conv.updated_at ? new Date(conv.updated_at).toLocaleDateString() : '';
                item.innerHTML = `<span class="conv-title" title="${title}">${title}</span><span style="font-size:0.7rem;color:#888;white-space:nowrap;">${time}</span><span class="conv-del" onclick="event.stopPropagation();deleteConversation('${conv.session_id}')">✕</span>`;
                item.onclick = () => loadConversation(conv.session_id);
                listEl.appendChild(item);
            });
        }

        async function loadConversation(sessionId) {
            try {
                const res = await fetch(`${API_BASE}/conversations/${sessionId}`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                currentSessionId = data.session_id;
                history = [];
                chatArea.innerHTML = '';
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        if (msg.role === 'human') {
                            appendMessage('user', msg.content);
                            history.push(['human', msg.content]);
                        } else if (msg.role === 'ai') {
                            appendMessage('agent', msg.content);
                            history.push(['ai', msg.content]);
                        }
                    });
                }
                if (chatArea.children.length === 0) {
                    chatArea.innerHTML = `
                        <div class="empty-state">
                            <h2>Comedy Agent</h2>
                            <p>输入你的创作需求，让 AI 为你生成喜剧内容</p>
                        </div>
                    `;
                }
                renderConversationList();
            } catch (err) {
                alert('加载会话失败: ' + err.message);
            }
        }

        async function deleteConversation(sessionId) {
            if (!confirm('确定删除该会话？')) return;
            try {
                const res = await fetch(`${API_BASE}/conversations/${sessionId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                if (currentSessionId === sessionId) {
                    startNewChat();
                }
                loadConversations();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function loadDocuments() {
            const listEl = document.getElementById('document-list');
            try {
                const res = await fetch(`${API_BASE}/documents`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                const docs = data.documents || [];
                if (docs.length === 0) {
                    listEl.innerHTML = '<div class="preference-empty">暂无文档</div>';
                    return;
                }
                listEl.innerHTML = '';
                docs.forEach(d => {
                    const item = document.createElement('div');
                    item.className = 'preference-item';
                    const statusColor = d.status === 'ingested' ? '#16c79a' : (d.status === 'failed' ? '#e94560' : '#999');
                    const statusText = d.status === 'ingested' ? '已入库' : (d.status === 'failed' ? '失败' : '处理中');
                    const errorTip = d.error_msg ? ` title="${d.error_msg.replace(/"/g, '&quot;')}"` : '';
                    item.innerHTML = `<span class="pref-key" title="${d.filename}">${d.filename}</span><span style="color:${statusColor};font-size:0.7rem;"${errorTip}>${statusText}</span><span style="color:#e94560;cursor:pointer;font-size:0.75rem;" onclick="deleteDocument('${d.doc_id}')">✕</span>`;
                    listEl.appendChild(item);
                });
            } catch {
                listEl.innerHTML = '<div class="preference-empty">加载失败</div>';
            }
        }

        async function uploadDocuments() {
            const input = document.getElementById('doc-upload-input');
            if (!input.files || input.files.length === 0) return;
            const formData = new FormData();
            for (const file of input.files) {
                formData.append('files', file);
            }
            try {
                const res = await fetch(`${API_BASE}/documents/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData,
                });
                if (!res.ok) throw new Error('上传失败');
                input.value = '';
                loadDocuments();
            } catch (err) {
                alert('上传失败: ' + err.message);
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('确定删除该文档？')) return;
            try {
                const res = await fetch(`${API_BASE}/documents/${docId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                loadDocuments();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function loadPreferences() {
            const listEl = document.getElementById('preference-list');
            try {
                const res = await fetch(`${API_BASE}/preferences`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                const prefs = data.preferences || [];
                if (prefs.length === 0) {
                    listEl.innerHTML = '<div class="preference-empty">暂无记录</div>';
                    return;
                }
                const keyMap = {
                    'preferred_style': '风格',
                    'disliked_tropes': '讨厌',
                    'preferred_duration': '时长',
                    'preferred_audience': '受众',
                    'preferred_script_type': '类型',
                    'creative_notes': '备注'
                };
                listEl.innerHTML = '';
                prefs.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'preference-item';
                    const label = keyMap[p.key] || p.key;
                    let val = '';
                    if (Array.isArray(p.value)) {
                        val = p.value.join(', ');
                    } else if (typeof p.value === 'object' && p.value !== null) {
                        val = JSON.stringify(p.value);
                    } else {
                        val = String(p.value);
                    }
                    item.innerHTML = `<span class="pref-key">${label}</span><span class="pref-val" title="${val}">${val}</span>`;
                    listEl.appendChild(item);
                });
            } catch {
                listEl.innerHTML = '<div class="preference-empty">加载失败</div>';
            }
        }

        loadConversations();
        loadDocuments();
        loadPreferences();
        loadScripts();
        loadSkills();

        async function loadSkills() {
            const listEl = document.getElementById('skill-list');
            try {
                const res = await fetch(`${API_BASE}/skills`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._skills = data.skills || [];
                renderSkillList();
            } catch (err) {
                console.error('加载 Skill 失败:', err);
                listEl.innerHTML = '<div class="skill-empty">加载失败</div>';
            }
        }

        function renderSkillList() {
            const listEl = document.getElementById('skill-list');
            const skills = window._skills || [];
            if (skills.length === 0) {
                listEl.innerHTML = '<div class="skill-empty">暂无 Skill</div>';
                return;
            }
            listEl.innerHTML = '';
            skills.forEach(s => {
                const item = document.createElement('div');
                item.className = 'skill-item';
                const sourceClass = s.source === 'builtin' ? 'builtin' : 'plugin';
                const sourceLabel = s.source === 'builtin' ? '内置' : '插件';
                const uninstallBtn = s.source === 'builtin'
                    ? ''
                    : `<button onclick="uninstallSkill('${s.name}')">卸载</button>`;
                item.innerHTML = `
                    <span class="skill-name" title="${s.description || ''}">${s.name}</span>
                    <span class="skill-meta">
                        <span class="skill-type">${s.task_type || ''}</span>
                        <span class="skill-source ${sourceClass}">${sourceLabel}</span>
                        ${uninstallBtn}
                    </span>
                `;
                listEl.appendChild(item);
            });
        }

        function openInstallSkillModal() {
            document.getElementById('install-skill-name').value = '';
            document.getElementById('install-skill-md').value = '';
            document.getElementById('install-skill-prompt').value = '';
            document.getElementById('install-skill-py').value = '';
            document.getElementById('install-skill-modal').classList.add('active');
        }

        function closeInstallSkillModal() {
            document.getElementById('install-skill-modal').classList.remove('active');
        }

        async function confirmInstallSkill() {
            const name = document.getElementById('install-skill-name').value.trim();
            const skillMd = document.getElementById('install-skill-md').value.trim();
            const promptTxt = document.getElementById('install-skill-prompt').value.trim();
            const skillPy = document.getElementById('install-skill-py').value.trim() || null;

            if (!name) { alert('请输入 Skill 名称'); return; }
            if (!skillMd) { alert('请输入 SKILL.md 内容'); return; }
            if (!promptTxt) { alert('请输入 prompt.txt 内容'); return; }

            try {
                const res = await fetch(`${API_BASE}/skills/install`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ name, skill_md: skillMd, prompt_txt: promptTxt, skill_py: skillPy }),
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || '安装失败');
                }
                closeInstallSkillModal();
                loadSkills();
                alert('Skill 安装成功');
            } catch (err) {
                alert('安装失败: ' + err.message);
            }
        }

        async function uninstallSkill(name) {
            if (!confirm(`确定卸载 Skill「${name}」？`)) return;
            try {
                const res = await fetch(`${API_BASE}/skills/${encodeURIComponent(name)}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || '卸载失败');
                }
                loadSkills();
                alert('Skill 已卸载');
            } catch (err) {
                alert('卸载失败: ' + err.message);
            }
        }

        async function reloadSkills() {
            try {
                const res = await fetch(`${API_BASE}/skills/reload`, {
                    method: 'POST',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('热重载失败');
                const data = await res.json();
                loadSkills();
                alert(`热重载完成：新增 ${data.added} 个，移除 ${data.removed} 个，未变更 ${data.unchanged} 个`);
            } catch (err) {
                alert('热重载失败: ' + err.message);
            }
        }

        async function loadScripts() {
            const listEl = document.getElementById('script-list');
            try {
                const res = await fetch(`${API_BASE}/scripts`, { headers: authHeaders() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                window._scripts = data.scripts || [];
                renderScriptList();
            } catch (err) {
                console.error('加载作品失败:', err);
                listEl.innerHTML = '<div class="script-empty">加载失败</div>';
            }
        }

        function renderScriptList() {
            const listEl = document.getElementById('script-list');
            const scripts = window._scripts || [];
            if (scripts.length === 0) {
                listEl.innerHTML = '<div class="script-empty">暂无作品</div>';
                return;
            }
            listEl.innerHTML = '';
            scripts.forEach(s => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.id = `script-item-${s.script_id}`;
                const title = s.title || '未命名作品';
                const typeLabel = s.script_type || '作品';
                const time = s.updated_at ? new Date(s.updated_at).toLocaleDateString() : '';
                const rating = s.rating != null ? Math.round(s.rating) : 0;
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<span class="${i <= rating ? 'active' : ''}" onclick="event.stopPropagation();rateScript('${s.script_id}', ${i})">★</span>`;
                }
                item.innerHTML = `
                    <div class="script-header" onclick="viewScript('${s.script_id}')">
                        <span class="script-title" title="${title}">${title}</span>
                        <span class="script-type">${typeLabel}</span>
                        <span class="script-rating">${starsHtml}</span>
                        <span class="script-time">${time}</span>
                    </div>
                    <div class="script-detail collapsed" id="script-detail-${s.script_id}">${escapeHtml(s.content)}</div>
                    <div class="script-actions">
                        <button class="btn-view" onclick="viewScript('${s.script_id}')">查看</button>
                        <button class="btn-del" onclick="deleteScript('${s.script_id}')">删除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function viewScript(scriptId) {
            const detail = document.getElementById(`script-detail-${scriptId}`);
            if (detail) {
                detail.classList.toggle('collapsed');
            }
        }

        async function deleteScript(scriptId) {
            if (!confirm('确定删除该作品？')) return;
            try {
                const res = await fetch(`${API_BASE}/scripts/${scriptId}`, {
                    method: 'DELETE',
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error('删除失败');
                loadScripts();
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        async function rateScript(scriptId, rating) {
            try {
                const res = await fetch(`${API_BASE}/scripts/${scriptId}/rate`, {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify({ rating: rating }),
                });
                if (!res.ok) throw new Error('评分失败');
                // 更新本地数据并重新渲染
                const s = (window._scripts || []).find(x => x.script_id === scriptId);
                if (s) s.rating = rating;
                renderScriptList();
            } catch (err) {
                alert('评分失败: ' + err.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user_id');
            window.location.href = '/static/login.html';
        }

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            };
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`, { headers: authHeaders() });
                const data = await res.json();
                if (data.status === 'ok') {
                    statusEl.textContent = '就绪';
                    statusEl.classList.add('ready');
                } else {
                    statusEl.textContent = '异常';
                }
            } catch {
                statusEl.textContent = '离线';
            }
        }

        async function loadModels() {
            const select = document.getElementById('model');
            try {
                const res = await fetch(`${API_BASE}/models`, { headers: authHeaders() });
                const data = await res.json();
                select.innerHTML = '';

                const models = data.models || [];
                const recommended = data.recommended;

                if (models.length === 0) {
                    select.innerHTML = '<option value="">无可用模型</option>';
                    return;
                }

                // 添加"默认"选项
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = recommended
                    ? `默认（${formatModelName(recommended)}）`
                    : '默认';
                select.appendChild(defaultOpt);

                models.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = formatModelName(name);
                    if (name === recommended) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            } catch {
                select.innerHTML = '<option value="">模型加载失败</option>';
            }
        }

        function formatModelName(name) {
            const map = {
                'gpt-4o': 'GPT-4o',
                'gpt-4o-mini': 'GPT-4o Mini',
                'gpt-4-turbo': 'GPT-4 Turbo',
                'claude-3-5-sonnet': 'Claude 3.5 Sonnet',
                'claude-3-opus': 'Claude 3 Opus',
                'claude-3-5-haiku': 'Claude 3.5 Haiku',
                'qwen-max': '通义千问 Max',
                'qwen-plus': '通义千问 Plus',
                'qwen-turbo': '通义千问 Turbo',
                'kimi-for-coding': 'Kimi',
                'kimi-code': 'Kimi Code',
                'ollama-llama3': 'Ollama Llama3',
                'ollama-llama3.1': 'Ollama Llama3.1',
                'ollama-qwen2.5': 'Ollama Qwen2.5',
            };
            return map[name] || name;
        }

        checkHealth();
        loadModels();
        setInterval(checkHealth, 30000);

        let _pendingScriptContent = '';

        function appendMessage(role, text) {
            const empty = chatArea.querySelector('.empty-state');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            let actionsHtml = '';
            if (role === 'agent') {
                actionsHtml = `<div class="message-actions"><button onclick="openSaveModal(this)" data-content="${escapeHtml(text).replace(/"/g, '&quot;')}">💾 保存为作品</button></div>`;
            }
            div.innerHTML = `<div class="meta">${role === 'user' ? '你' : 'Agent'}</div>${escapeHtml(text)}${actionsHtml}`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function openSaveModal(btn) {
            _pendingScriptContent = btn.getAttribute('data-content') || '';
            document.getElementById('script-title').value = '';
            document.getElementById('script-type').value = '';
            document.getElementById('save-script-modal').classList.add('active');
        }

        function closeSaveModal() {
            document.getElementById('save-script-modal').classList.remove('active');
            _pendingScriptContent = '';
        }

        async function confirmSaveScript() {
            const title = document.getElementById('script-title').value.trim();
            const type = document.getElementById('script-type').value;
            if (!title) {
                alert('请输入作品标题');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/scripts`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        user_id: currentUserId,
                        title: title,
                        content: _pendingScriptContent,
                        script_type: type || null,
                    }),
                });
                if (!res.ok) throw new Error('保存失败');
                closeSaveModal();
                loadScripts();
                alert('作品已保存到「我的作品」');
            } catch (err) {
                alert('保存失败: ' + err.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            input.disabled = loading;
            if (loading) {
                const typing = document.createElement('div');
                typing.className = 'typing';
                typing.id = 'typing-indicator';
                typing.textContent = 'Agent 正在思考...';
                chatArea.appendChild(typing);
                chatArea.scrollTop = chatArea.scrollHeight;
            } else {
                const t = document.getElementById('typing-indicator');
                if (t) t.remove();
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            const model = document.getElementById('model').value || null;

            input.value = '';
            appendMessage('user', text);
            setLoading(true);

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        prompt: text,
                        model: model,
                        session_id: currentSessionId,
                        chat_history: history,
                    }),
                });
                const data = await res.json();
                if (res.ok) {
                    appendMessage('agent', data.output);
                    history.push(['human', text]);
                    history.push(['ai', data.output]);
                    if (history.length > 20) history = history.slice(-20);
                    currentSessionId = data.session_id || currentSessionId;
                    loadConversations();
                } else {
                    appendMessage('agent', `错误: ${data.detail || '未知错误'}`);
                }
            } catch (err) {
                appendMessage('agent', `请求失败: ${err.message}`);
            } finally {
                setLoading(false);
            }
        }

        function sendQuick(text) {
            input.value = text;
            sendMessage();
        }
    </script>
</body>
</html>
