<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喜剧换 · Comedy Swap — 物品/服务交换市场</title>
<meta name="description" content="喜剧换 Comedy Swap — 面向喜剧人的物品与服务交换市场，以物换物、以技换技。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="swap-common.css">
<style>
/* ===== 顶栏扩展：搜索框 ===== */
.search-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;padding:0 6px 0 16px;height:40px;width:min(320px,32vw);transition:.25s}
.search-box:focus-within{border-color:var(--lobster);box-shadow:0 0 0 3px rgba(233,69,96,.15)}
.search-box input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:13.5px;font-family:inherit}
.search-box input::placeholder{color:var(--faint)}
.search-box button{width:30px;height:30px;border-radius:50%;background:var(--lobster-soft);color:var(--lobster);font-size:14px;display:grid;place-items:center;transition:.2s;flex:none}
.search-box button:hover{background:var(--lobster);color:#fff}
.topbar .mid{display:flex;align-items:center;gap:14px}

/* ===== Hero 头图区 ===== */
.hero{padding:36px 0 10px;text-align:center;position:relative}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5vw,52px);letter-spacing:.04em;line-height:1.25}
.hero h1 .hl{background:linear-gradient(90deg,var(--lobster),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{margin-top:12px;color:var(--muted);font-size:clamp(13px,1.5vw,15px)}

/* ===== 精选区 ===== */
.featured-sec{margin-top:44px}
.featured-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
.f-card{position:relative;display:flex;flex-direction:column;border:1px solid rgba(245,175,25,.38);background:linear-gradient(180deg,rgba(245,175,25,.05),var(--card) 45%);cursor:pointer}
.f-card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 16px 40px rgba(245,175,25,.12)}
.f-badge{position:absolute;top:12px;left:12px;z-index:2;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.12em;
  color:#0f0f1a;background:linear-gradient(90deg,var(--gold),var(--gold-light));box-shadow:0 4px 12px rgba(245,175,25,.4)}
.f-cover{aspect-ratio:4/3;overflow:hidden}
.f-cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
.f-card:hover .f-cover img{transform:scale(1.05)}
.f-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.f-title{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-want{font-size:12.5px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--faint)}

/* ===== 列表区 ===== */
.list-sec{margin-top:56px}
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.o-card{display:flex;flex-direction:column;cursor:pointer}
.o-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.o-cover{aspect-ratio:4/3;overflow:hidden;position:relative}
.o-cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
.o-card:hover .o-cover img{transform:scale(1.05)}
.o-cover .tag{position:absolute;top:10px;right:10px;backdrop-filter:blur(6px)}
.o-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.o-title{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.5}
.o-maker{font-size:12.5px;color:var(--faint)}
.o-want{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.o-foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.o-foot .offers{color:var(--gold-light)}

.load-more-wrap{text-align:center;margin-top:40px}
.load-status{text-align:center;color:var(--faint);font-size:13px;margin-top:20px}

@media(max-width:1100px){
  .featured-grid{grid-template-columns:repeat(2,1fr)}
  .order-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .featured-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .order-grid{grid-template-columns:1fr}
  .topbar .mid .search-box{display:none}
}
@media(max-width:480px){
  .featured-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo">喜剧<em>换</em></span>
    <span class="sub">COMEDY SWAP</span>
  </a>
  <div class="mid">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="搜索想换的物品 / 服务…" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" title="搜索">🔍</button>
    </div>
    <a class="btn-primary btn-sm" href="create.html">＋ 发起交换</a>
  </div>
  <div class="auth-area" id="auth-area"></div>
</header>

<main class="page-wrap">

  <!-- ===== Hero ===== -->
  <section class="hero">
    <h1>以物换物，<span class="hl">以技换技</span></h1>
    <p class="sub">面向喜剧人的物品 / 服务交换市场 —— 你提供的，换你想要的。</p>
  </section>

  <!-- ===== 精选区（无数据时整块隐藏）===== -->
  <section class="featured-sec" id="featured-sec" style="display:none;">
    <div class="list-head">
      <div>
        <span class="sec-eyebrow gold">⭐ FEATURED</span>
        <h2 class="sec-title">精选交换</h2>
      </div>
    </div>
    <div class="featured-grid" id="featured-grid"></div>
  </section>

  <!-- ===== 最新交换 ===== -->
  <section class="list-sec">
    <div class="list-head">
      <div>
        <span class="sec-eyebrow lobster">🔄 SWAP</span>
        <h2 class="sec-title" id="list-title">最新交换</h2>
      </div>
      <div class="tabs" id="status-tabs">
        <button class="tab active" data-status="" onclick="switchStatus(this)">全部</button>
        <button class="tab" data-status="open" onclick="switchStatus(this)">征集中</button>
      </div>
    </div>
    <div id="list-container">
      <div class="loading-state" id="list-loading">加载中…</div>
      <div class="order-grid" id="order-grid"></div>
      <div class="empty-state" id="list-empty" style="display:none;">
        <div class="ico">🎭</div>
        <p>这里还空空如也，来发第一单吧</p>
      </div>
    </div>
    <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
      <button class="btn-ghost" id="load-more-btn" onclick="loadMore()">加载更多</button>
    </div>
    <div class="load-status" id="load-status"></div>
  </section>

</main>

<footer class="footer">
  <a href="index.html">交换市场</a><span class="sep">·</span>
  <a href="https://comedyclaw.cn" target="_blank" rel="noopener">喜剧龙虾主站</a><span class="sep">·</span>
  <span>喜剧换 · Comedy Swap</span>
</footer>

<script src="common.js"></script>
<script>
const PAGE_SIZE = 12;
let curPage = 1;
let curKeyword = '';
let curStatus = '';
let hasMore = true;
let loading = false;

const STATUS_LABEL = { open: '征集中', matched: '已成交', closed: '已关闭' };

function statusTag(status) {
    const map = { open: 'tag-open', matched: 'tag-matched', closed: 'tag-closed' };
    return `<span class="tag ${map[status] || 'tag-closed'}">${STATUS_LABEL[status] || escapeHtml(status)}</span>`;
}

function coverHtml(order) {
    if (order.images && order.images.length) {
        return `<img src="${escapeHtml(order.images[0])}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=img-ph>🎁</div>'">`;
    }
    return `<div class="img-ph">🎁</div>`;
}

function orderCardHtml(order) {
    const offers = order.offer_count != null ? order.offer_count : 0;
    return `
    <article class="card o-card" onclick="goOrder(${order.order_id ?? order.id})">
      <div class="o-cover">${coverHtml(order)}${statusTag(order.status)}</div>
      <div class="o-body">
        <h3 class="o-title">${escapeHtml(order.title)}</h3>
        <div class="o-maker">来自：一位喜剧人</div>
        <p class="o-want">想换：${escapeHtml(truncate(order.want_desc, 60))}</p>
        <div class="o-foot">
          <span class="offers">🤝 ${offers} 个 offer</span>
        </div>
      </div>
    </article>`;
}

function goOrder(id) {
    window.location.href = 'order.html?id=' + encodeURIComponent(id);
}

/* ===== 精选区 ===== */
async function loadFeatured() {
    const sec = document.getElementById('featured-sec');
    try {
        const res = await apiFetch('/swap/orders?featured=1&page_size=8');
        const data = await res.json();
        const items = data.items || data.orders || data.list || (Array.isArray(data) ? data : []);
        if (!items.length) { sec.style.display = 'none'; return; }
        document.getElementById('featured-grid').innerHTML = items.map(o => `
          <article class="card f-card" onclick="goOrder(${o.order_id ?? o.id})">
            <span class="f-badge">⭐ 精选</span>
            <div class="f-cover">${coverHtml(o)}</div>
            <div class="f-body">
              <h3 class="f-title">${escapeHtml(o.title)}</h3>
              <p class="f-want">想换：${escapeHtml(truncate(o.want_desc, 48))}</p>
              <div class="f-meta"><span>来自：一位喜剧人</span><span>🤝 ${o.offer_count ?? 0}</span></div>
            </div>
          </article>`).join('');
        sec.style.display = '';
    } catch {
        sec.style.display = 'none'; // 精选接口失败（未部署/无权限）不影响主列表
    }
}

/* ===== 列表 ===== */
function buildListUrl(page) {
    const p = new URLSearchParams();
    p.set('page', String(page));
    p.set('page_size', String(PAGE_SIZE));
    if (curKeyword) p.set('keyword', curKeyword);
    if (curStatus) p.set('status', curStatus);
    return '/swap/orders?' + p.toString();
}

async function loadOrders(page, append) {
    if (loading) return;
    loading = true;
    const grid = document.getElementById('order-grid');
    const empty = document.getElementById('list-empty');
    const moreWrap = document.getElementById('load-more-wrap');
    const status = document.getElementById('load-status');
    if (!append) {
        grid.innerHTML = '';
        empty.style.display = 'none';
        moreWrap.style.display = 'none';
        status.textContent = '';
        document.getElementById('list-loading').style.display = '';
    }
    try {
        const res = await apiFetch(buildListUrl(page));
        const data = await res.json();
        const items = data.items || data.orders || data.list || (Array.isArray(data) ? data : []);
        document.getElementById('list-loading').style.display = 'none';
        if (!items.length && !append) {
            empty.style.display = '';
            hasMore = false;
            return;
        }
        grid.insertAdjacentHTML('beforeend', items.map(orderCardHtml).join(''));
        // 分页：total / has_more / 当前返回条数 三种判定
        const total = data.total != null ? data.total : null;
        hasMore = data.has_more != null ? !!data.has_more
                : total != null ? page * PAGE_SIZE < total
                : items.length >= PAGE_SIZE;
        if (hasMore) moreWrap.style.display = '';
        else status.textContent = items.length || total ? '— 已经到底啦 —' : '';
    } catch (e) {
        document.getElementById('list-loading').style.display = 'none';
        if (!append) {
            empty.style.display = '';
            document.getElementById('list-empty').innerHTML =
                '<div class="ico">🛰️</div><p>加载失败：' + escapeHtml(e.message) + '</p>';
        } else {
            toast('加载失败：' + e.message, 'error');
        }
    } finally {
        loading = false;
    }
}

function loadMore() {
    curPage += 1;
    loadOrders(curPage, true);
}

/* ===== 搜索 ===== */
function doSearch() {
    curKeyword = document.getElementById('search-input').value.trim();
    curPage = 1;
    document.getElementById('list-title').textContent = curKeyword ? `搜索：${curKeyword}` : '最新交换';
    loadOrders(1, false);
}

/* ===== 状态筛选 ===== */
function switchStatus(btn) {
    document.querySelectorAll('#status-tabs .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    curStatus = btn.dataset.status || '';
    curPage = 1;
    loadOrders(1, false);
}

renderAuthArea();
loadFeatured();
loadOrders(1, false);
</script>
</body>
</html>
